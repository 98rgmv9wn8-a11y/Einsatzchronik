/* Bildverarbeitung: verkleinern, EXIF-Drehung berücksichtigen, als JPEG speichern */
async function processImage(file) {
  if (!/^image\//.test(file.type)) throw new Error('Das ist keine Bilddatei.');
  if (file.size > 40 * 1024 * 1024) throw new Error('Die Bilddatei ist größer als 40 MB.');
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    bmp = await new Promise((res, rej) => {
      const url = URL.createObjectURL(file), im = new Image();
      im.onload = () => { URL.revokeObjectURL(url); res(im); };
      im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Das Bildformat wird nicht unterstützt.')); };
      im.src = url;
    });
  }
  const bw = bmp.width || bmp.naturalWidth, bh = bmp.height || bmp.naturalHeight;
  if (!bw || !bh) throw new Error('Das Bild konnte nicht gelesen werden.');
  const draw = max => {
    const s = Math.min(1, max / Math.max(bw, bh));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(bw * s)); c.height = Math.max(1, Math.round(bh * s));
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(bmp, 0, 0, c.width, c.height);
    return { url: c.toDataURL('image/jpeg', max > 500 ? 0.82 : 0.75), w: c.width, h: c.height };
  };
  const full = draw(1600), thumb = draw(360);
  if (bmp.close) try { bmp.close(); } catch (e) { /* ignore */ }
  return { full: full.url, thumb: thumb.url, w: full.w, h: full.h };
}
async function wizAddPhotos(el) {
  const files = Array.from(el.files || []);
  el.value = '';
  if (!files.length) return;
  const d = W.d;
  let added = 0;
  for (const f of files) {
    if (d.photos.length >= 25) { toast('Mehr als 25 Fotos pro Einsatz sind nicht vorgesehen.'); break; }
    try {
      const r = await processImage(f);
      const id = newPhotoId(d.id);
      await DB.put('photos', { id, data: r.full });
      await DB.put('thumbs', { id, data: r.thumb });
      THUMB_CACHE.set(id, r.thumb);
      d.photos.push({ id, caption: '', w: r.w, h: r.h });
      added++;
    } catch (e) { toast(e.message || 'Das Foto konnte nicht gespeichert werden.'); }

  if (added) { markDirty(); if (W.active) rerender(); }
}

/* ==========================================================================
   Einsatzchronik – Chronik (Liste, Suche, Filter) und Detailseite
   ========================================================================== */

const RANGES = [['all', 'Gesamter Zeitraum'], ['7', 'Letzte 7 Tage'], ['30', 'Letzte 30 Tage'], ['90', 'Letzte 90 Tage'], ['year', 'Dieses Jahr'], ['custom', 'Eigener Zeitraum']];

function rangeBounds(f) {
  let from = 0, to = Infinity;
  if (f.range === '7' || f.range === '30' || f.range === '90') { const d = daysAgo(Number(f.range) - 1); d.setHours(0, 0, 0, 0); from = d.getTime(); }
  else if (f.range === 'year') from = new Date(new Date().getFullYear(), 0, 1).getTime();
  else if (f.range === 'custom') {
    if (validDate(f.from)) from = toTs(f.from, '00:00');
    if (validDate(f.to)) to = toTs(f.to, '23:59') + 59999;
  }
  return [from, to];
}

function applyFilter(list, f) {
  const words = norm(f.q.trim()).split(/\s+/).filter(Boolean);
  const [from, to] = rangeBounds(f);
  const kw = norm(f.keyword);
  return list.filter(i => {
    if (i.ts < from || i.ts > to) return false;
    if (f.domain && i.domain !== f.domain) return false;
    if (f.vehicle && i.vehicleType !== f.vehicle) return false;
    if (f.role && i.role !== f.role) return false;
    if (f.type && !i.types.includes(f.type)) return false;
    if (f.tags.length && !f.tags.every(t => i.tags.includes(t))) return false;
    if (f.proc && !(i.procedures.some(p => p.name === f.proc) || i.activities.some(a => a.name === f.proc))) return false;
    if (f.med && !i.medications.some(m => m.name === f.med)) return false;
    if (f.crit && i.criticality !== f.crit) return false;
    if (kw && !i.keywords.some(k => norm(k) === kw)) return false;
    if (f.fav && !i.favorite) return false;
    if (words.length) { const t = searchText(i); if (!words.every(w => t.includes(w))) return false; }
    return true;
  });
}

function filterOptions() {
  const o = { vehicle: new Set(), role: new Set(), type: new Set(), proc: new Set(), med: new Set(), keyword: new Set(), tags: new Set() };
  S.lists.tags.forEach(t => o.tags.add(t.name));
  S.incidents.forEach(i => {
    if (i.vehicleType) o.vehicle.add(i.vehicleType);
    if (i.role) o.role.add(i.role);
    i.types.forEach(t => o.type.add(t));
    i.procedures.forEach(p => o.proc.add(p.name));
    i.activities.forEach(a => o.proc.add(a.name));
    i.medications.forEach(m => o.med.add(m.name));
    i.keywords.forEach(k => o.keyword.add(k));
    i.tags.forEach(t => o.tags.add(t));
  });
  const out = {};
  for (const k of Object.keys(o)) out[k] = Array.from(o[k]).sort(byName);
  return out;
}

function activeFilters() {
  const f = S.filter, a = [];
  if (f.range !== 'all') {
    let l = (RANGES.find(r => r[0] === f.range) || [])[1] || '';
    if (f.range === 'custom') l = `${f.from ? fmtDateShort(f.from) : 'offen'} bis ${f.to ? fmtDateShort(f.to) : 'offen'}`;
    a.push({ k: 'range', label: l });
  }
  if (f.domain) a.push({ k: 'domain', label: DOMAIN[f.domain].label });
  if (f.vehicle) a.push({ k: 'vehicle', label: `Fahrzeug: ${f.vehicle}` });
  if (f.role) a.push({ k: 'role', label: `Funktion: ${f.role}` });
  if (f.type) a.push({ k: 'type', label: `Einsatzart: ${f.type}` });
  f.tags.forEach(t => a.push({ k: 'tag', v: t, label: `Kategorie: ${t}` }));
  if (f.proc) a.push({ k: 'proc', label: `Maßnahme: ${f.proc}` });
  if (f.med) a.push({ k: 'med', label: `Medikament: ${f.med}` });
  if (f.crit) a.push({ k: 'crit', label: critLabel(f.crit) });
  if (f.keyword) a.push({ k: 'keyword', label: `Schlagwort: ${f.keyword}` });
  if (f.fav) a.push({ k: 'fav', label: 'Favoriten' });
  return a;
}

function sumHtml(res) {
  const af = activeFilters();
  return html`${af.length ? html`<div class="active-f">${af.map(a => html`<span class="tagp kw">${a.label}<button type="button" data-act="fClear" data-k="${a.k}" ${a.v ? attrs({ v: a.v }) : ''} aria-label="Filter ${a.label} entfernen">${ic('x')}</button></span>`)}</div>` : ''}
    <p class="resultline" role="status">${res.length === S.incidents.length ? plural(res.length, 'Einsatz', 'Einsätze') : `${res.length} von ${plural(S.incidents.length, 'Einsatz', 'Einsätzen')}`}</p>`;
}

function listHtml(res) {
  if (!S.incidents.length) {
    return html`<div class="empty">${ic('list')}<h3>Noch keine Einsätze</h3><p>Dokumentiere deinen ersten Einsatz. Das dauert ein bis zwei Minuten.</p><button type="button" class="btn primary" data-act="nav" data-to="neu">${ic('plus')}Neuer Einsatz</button></div>`;
  }
  if (!res.length) {
    return html`<div class="empty">${ic('search')}<h3>Keine Treffer</h3><p>Zu dieser Suche passt kein Einsatz. Prüfe die Schreibweise oder lockere die Filter.</p><button type="button" class="btn" data-act="fReset">${ic('refresh')}Filter zurücksetzen</button></div>`;
  }
  const counts = new Map();
  res.forEach(i => { const k = monthKey(i.date); counts.set(k, (counts.get(k) || 0) + 1); });
  const shown = res.slice(0, S.ui.chrLimit);
  let cur = '', out = [];
  shown.forEach(i => {
    const k = monthKey(i.date);
    if (k !== cur) {
      if (cur) out.push(raw('</div>'));
      cur = k;
      out.push(html`<h2 class="mon"><span>${monthLabel(k)}</span><span>${counts.get(k)}</span></h2><div class="list">`);
    }
    out.push(incRow(i));
  });
  out.push(raw('</div>'));
  if (res.length > shown.length) out.push(html`<div style="margin-top:16px"><button type="button" class="btn block" data-act="chrMore">${res.length - shown.length} weitere anzeigen</button></div>`);
  return html`${out}`;
}

  const res = applyFilter(sortedIncidents(), S.filter);
  const s = $('#chr-sum'), l = $('#chr-list');

  s.innerHTML = sumHtml(res).s;
  l.innerHTML = listHtml(res).s;
  const n = activeFilters().length, b = $('#chr-fcount');
  if (b) { b.textContent = String(n); b.hidden = n === 0; }
}
function updateChrPanel() { const p = $('#chr-panel'); if (p) p.innerHTML = panelHtml().s; }

const avgStr = (s, n) => (n ? fmtNum(s / n, 1) : '–');
const domSeriesDefs = () => DOM_KEYS.map(d => ({ k: d, label: DOMAIN[d].label, color: DOM_COLOR[d] }));

/* Einsätze je Monat und Bereich */
function monthDomData(incs, keys) {
  const m = new Map(keys.map(k => [k, { fw: 0, rd: 0, dlrg: 0 }]));
  incs.forEach(i => { const e = m.get(monthKey(i.date)); if (e) e[i.domain]++; });
  return keys.map(k => Object.assign({ k }, m.get(k)));
}
function domMonthSpec(id, title, sub, incs, keys, extra = {}) {
  const data = monthDomData(incs, keys);
  let ser = domSeriesDefs().filter(s => data.some(x => x[s.k] > 0));
  if (!ser.length) ser = [domSeriesDefs()[0]];
  return Object.assign({
    id, title, sub, kinds: ['col', 'line', 'table'], def: 'col', ordered: true, unit: 'Einsätze', catLabel: 'Monat',
    series: ser, rows: data.map(x => monthRow(x.k, ser.map(s => x[s.k]))),
  }, extra);
}

  const ok = await confirmBox({ title: 'Entwurf verwerfen?', text: 'Der gespeicherte Entwurf und die dazugehörigen Fotos werden gelöscht.', ok: 'Verwerfen', danger: true });
  if (!ok) return;
  await discardDraft();
  rerender();
};
ACT.snoozeBackup = async () => { S.settings.backupSnooze = Date.now() + 7 * 86400000; await saveSettings(); rerender(); };
ACT.toBackup = () => { S.ui.adminTab = 'data'; return go('admin', {}, { reset: true }); };

/* ---- 82-charts.js ---- */
/* ==========================================================================
   Einsatzchronik – Diagramm-Engine
   Eine Auswertung wird einmal beschrieben (Zeilen, Serien, Farben) und lässt sich als Balken, Säulen, Ring,
   Linie oder Tabelle zeigen. Die gewählte Darstellung wird je Auswertung gemerkt (settings.chartKinds).
   Farben: Kategorien folgen der festen Reihenfolge der Palette (--cat-1 bis --cat-8), Bereiche haben feste Farben.
   ========================================================================== */

const VZ_KINDS = {
  bar: { label: 'Balken', icon: 'cbar' },
  col: { label: 'Säulen', icon: 'bars' },
  donut: { label: 'Ring', icon: 'cpie' },
  line: { label: 'Linie', icon: 'cline' },
  table: { label: 'Tabelle', icon: 'table' },
};
const CHARTS = {};                       // Beschreibungen der aktuell gezeigten Auswertungen
const catColor = i => `var(--cat-${(i % 8) + 1})`;
const AREA_COLOR = { brand: 'var(--c-brand)', th: 'var(--c-th)', fwother: 'var(--c-fwother)', rd: 'var(--c-rd)', dlrg: 'var(--c-dlrg)' };
const DOM_COLOR = { fw: 'var(--red)', rd: 'var(--blue)', dlrg: 'var(--yellow)' };
const MODE_COLOR = { main: 'var(--cat-1)', volunteer: 'var(--cat-2)', side: 'var(--cat-3)' };
const sumArr = a => a.reduce((x, y) => x + y, 0);
const fmtCount = n => fmtNum(Math.round(n * 10) / 10, 1);

/* Obere Grenze der Achse: bei Zählwerten eine gerade Zahl, damit die Mitte ebenfalls ganzzahlig ist */
function vzTop(max, int) {
  if (!(max > 0)) return int ? 4 : 1;
  const p = Math.pow(10, Math.floor(Math.log10(max)));
  if (int) {
    if (max <= 10) return Math.max(4, Math.ceil(max / 2) * 2);
    const s = p / 5;
    return Math.ceil(max / s) * s;
  }
  for (const f of [1, 1.5, 2, 3, 4, 5, 6, 8, 10]) if (f * p >= max) return f * p;
  return 10 * p;
}
const vzTick = (n, fmt) => (n >= 10000 ? `${fmtNum(Math.round(n / 100) / 10, 1)}k` : (fmt ? fmt(n) : fmtCount(n)));

/* Zeilen aus einer Auszählung: [[Name, Anzahl, Farbe?], ...] */
const rowsOf = (entries, color) => entries.map(([label, n, c]) => ({ label, v: [n], color: c || color }));

function vzTip(r, spec, fmt, total) {
  const multi = spec.series.length > 1;
  const rows = [];
  spec.series.forEach((s, j) => { if (!multi || r.v[j] > 0) rows.push({ s: (!multi && r.color) || s.color, v: fmt(r.v[j]), l: multi ? s.label : (spec.unit || '') }); });
  if (multi) rows.push({ s: 'none', v: fmt(total), l: 'gesamt' });
  else if (spec.grand > 0 && spec.share !== false) rows.push({ s: 'none', v: `${pct(total, spec.grand)} %`, l: 'Anteil' });
  return tipAttr(r.tip || r.label, rows);
}
function vzAria(r, spec, fmt, total) {
  const name = r.tip || r.label;
  if (spec.series.length === 1) return `${name}: ${fmt(total)} ${spec.unit || ''}`.trim();
  const parts = spec.series.map((s, j) => (r.v[j] > 0 ? `${s.label} ${fmt(r.v[j])}` : '')).filter(Boolean);
  return `${name}: ${parts.join(', ')}, gesamt ${fmt(total)}`;
}

/* ---------- Balken (waagerecht) ---------- */
function vzBar(spec, rows, tot, fmt) {
  const max = Math.max(1e-9, ...tot);
  return html`<div class="vz-hb">${rows.map((r, i) => html`<div class="vz-hr"><div class="vz-hl">${r.label}</div>
    <div class="vz-ht"><span class="vz-hbar" style="width:${(tot[i] / max * 84).toFixed(2)}%" tabindex="0" role="img" aria-label="${vzAria(r, spec, fmt, tot[i])}" data-tip="${vzTip(r, spec, fmt, tot[i])}">${spec.series.map((s, j) => (r.v[j] > 0 ? html`<i style="flex:${r.v[j]} 1 0;--c:${(spec.series.length === 1 && r.color) || s.color}"></i>` : ''))}</span><span class="vz-hv">${fmt(tot[i])}</span></div></div>`)}</div>`;
}

/* ---------- Säulen (senkrecht) ---------- */
function vzCol(spec, rows, tot, fmt) {
  const top = vzTop(Math.max(0, ...tot), spec.int !== false);
  const every = spec.xEvery || (rows.length > 16 ? Math.ceil(rows.length / 10) : 1);
  return html`<div class="vz-cols ${rows.length > 8 ? 'many' : ''}">
    <div class="vz-y" aria-hidden="true"><span>${vzTick(top, fmt)}</span><span>${vzTick(top / 2, fmt)}</span><span>0</span></div>
    <div class="vz-plot">${rows.map((r, i) => html`<div class="vz-slot" tabindex="0" role="img" aria-label="${vzAria(r, spec, fmt, tot[i])}" data-tip="${vzTip(r, spec, fmt, tot[i])}"><div class="vz-col" style="--p:${(tot[i] / top * 100).toFixed(1)}">${spec.series.map((s, j) => (r.v[j] > 0 ? html`<i style="--n:${r.v[j]};--c:${(spec.series.length === 1 && r.color) || s.color}"></i>` : ''))}</div></div>`)}</div>
    <div class="vz-x">${rows.map((r, i) => html`<span>${i % every === 0 ? (r.xl != null ? r.xl : r.label) : ''}</span>`)}</div></div>`;
}

/* ---------- Linie ---------- */
function vzLine(spec, rows, tot, fmt) {
  const W = 360, H = 190, L = 36, R = 12, T = 12, B = 26;
  const top = vzTop(Math.max(0, ...rows.map(r => Math.max(...r.v))), spec.int !== false);
  const n = rows.length, pw = W - L - R, ph = H - T - B;
  const X = i => L + (n === 1 ? pw / 2 : (pw * i) / (n - 1));
  const Y = v => T + ph - (v / top) * ph;
  const every = spec.xEvery || (n > 14 ? Math.ceil(n / 8) : 1);
  const dots = n <= 16;
  const lines = spec.series.map((s, j) => {
    const pts = rows.map((r, i) => `${X(i).toFixed(1)},${Y(r.v[j]).toFixed(1)}`).join(' ');
    const area = spec.series.length === 1 ? `<polygon points="${X(0).toFixed(1)},${(T + ph)} ${pts} ${X(n - 1).toFixed(1)},${(T + ph)}" fill="${s.color}" opacity=".10"/>` : '';
    return `${area}<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join('');
  const marks = spec.series.map((s, j) => rows.map((r, i) => (dots || i === n - 1) ? `<circle cx="${X(i).toFixed(1)}" cy="${Y(r.v[j]).toFixed(1)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>` : '').join('')).join('');
  const grid = [0, 0.5, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${(T + ph - f * ph).toFixed(1)}" y2="${(T + ph - f * ph).toFixed(1)}" class="${f === 0 ? 'vz-ax' : 'vz-gr'}"/><text x="${L - 6}" y="${(T + ph - f * ph + 3.5).toFixed(1)}" text-anchor="end" class="vz-t">${esc(vzTick(top * f, fmt))}</text>`).join('');
  const xl = rows.map((r, i) => (i % every === 0 ? `<text x="${X(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" class="vz-t">${esc(r.xl != null ? r.xl : r.label)}</text>` : '')).join('');
  const slot = pw / Math.max(1, n - 1);
  const hits = rows.map((r, i) => html`<g class="vz-hit" tabindex="0" role="img" aria-label="${vzAria(r, spec, fmt, tot[i])}" data-tip="${vzTip(r, spec, fmt, tot[i])}"><rect x="${(X(i) - slot / 2).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${ph}" fill="transparent"/><line x1="${X(i).toFixed(1)}" x2="${X(i).toFixed(1)}" y1="${T}" y2="${T + ph}" class="vz-ch"/></g>`);
  return html`<svg class="vz-line" viewBox="0 0 ${W} ${H}" role="group" aria-label="${spec.title}">${raw(grid + xl + lines + marks)}${hits}</svg>`;
}

/* ---------- Ring ---------- */
function vzDonut(spec, rows, tot, fmt) {
  let items = rows.map((r, i) => ({ label: r.label, tip: r.tip, n: tot[i], color: r.color || catColor(i) })).filter(x => x.n > 0);
  if (items.length > 7) {
    const rest = items.slice(6);
    items = items.slice(0, 6).concat([{ label: 'Weitere', tip: `Weitere (${rest.length})`, n: sumArr(rest.map(x => x.n)), color: 'var(--muted)' }]);
  }
  const total = sumArr(items.map(x => x.n)) || 1;
  const R = 50, C = 2 * Math.PI * R, gap = items.length > 1 ? 2.5 : 0;
  let acc = 0;
  const segs = items.map(it => {
    const len = (it.n / total) * C, vis = Math.max(1, len - gap);
    const seg = html`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${it.color}" stroke-width="20" stroke-dasharray="${vis.toFixed(2)} ${(C - vis).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 70 70)" tabindex="0" role="img" aria-label="${it.tip || it.label}: ${fmt(it.n)}, ${pct(it.n, total)} %" data-tip="${tipAttr(it.tip || it.label, [{ s: it.color, v: fmt(it.n), l: spec.unit || '' }, { s: 'none', v: `${pct(it.n, total)} %`, l: 'Anteil' }])}"/>`;
    acc += len;
    return seg;
  });
  return html`<div class="vz-donut"><svg viewBox="0 0 140 140" class="vz-ring" role="group" aria-label="${spec.title}">${segs}<text x="70" y="68" text-anchor="middle" class="vz-dn">${fmt(sumArr(items.map(x => x.n)))}</text><text x="70" y="85" text-anchor="middle" class="vz-dl">${spec.unit || ''}</text></svg>
    <ul class="vz-dleg">${items.map(it => html`<li><i style="--c:${it.color}"></i><span>${it.label}</span><b>${fmt(it.n)}</b><small>${pct(it.n, total)} %</small></li>`)}</ul></div>`;
}

/* ---------- Tabelle ---------- */
function vzTable(spec, rows, tot, fmt) {
  const multi = spec.series.length > 1;
  const head = spec.tableHead || [spec.catLabel || 'Auswertung'].concat(spec.series.map(s => s.label), multi ? ['Gesamt'] : []);
  const body = (spec.tableRows || rows.map((r, i) => [r.tip || r.label].concat(r.v.map(fmt), multi ? [fmt(tot[i])] : [])));
  return html`<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map((h, i) => html`<th class="${i ? 'num' : ''}">${h}</th>`)}</tr></thead>
    <tbody>${body.map(r => html`<tr>${r.map((c, i) => html`<td class="${i ? 'num' : ''}">${c}</td>`)}</tr>`)}</tbody></table></div>`;
}

/* Welche Darstellungen passen zur Auswertung? */
function vzAllowed(spec) {
  return spec.kinds.filter(k => {
    if (k === 'donut') return spec.series.length === 1 && spec.rows.filter(r => sumArr(r.v) > 0).length >= 2;
    if (k === 'line') return !!spec.ordered && spec.rows.length >= 3;
    return true;
  });
}
const vzKind = spec => {
  const ok = vzAllowed(spec), want = S.settings && S.settings.chartKinds && S.settings.chartKinds[spec.id];
  return ok.includes(want) ? want : (ok.includes(spec.def) ? spec.def : ok[0]);
};

function vizBody(spec, kind) {
  const rows = spec.rows, fmt = spec.fmt || fmtCount;
  const tot = rows.map(r => sumArr(r.v));
  spec.grand = sumArr(tot);
  if (!rows.length || !(spec.grand > 0 || kind === 'table')) return html`<p class="muted small">Noch keine Daten.</p>`;
  const legend = spec.series.length > 1 && kind !== 'table' && kind !== 'donut'
    ? html`<div class="legend" aria-label="Legende">${spec.series.map(s => html`<span><i class="sq" style="--c:${s.color}"></i>${s.label}</span>`)}</div>` : '';
  const view = { bar: vzBar, col: vzCol, line: vzLine, donut: vzDonut, table: vzTable }[kind](spec, rows, tot, fmt);
  return html`${view}${legend}`;
}

function vizCard(spec) {
  spec.kinds = spec.kinds || ['bar', 'table'];
  CHARTS[spec.id] = spec;
  const ok = vzAllowed(spec), kind = vzKind(spec);
  return html`<section class="card chart ${spec.full ? 'full' : ''}" data-chart="${spec.id}">
    <div class="chart-h"><div><h3>${spec.title}</h3>${spec.sub ? html`<p>${spec.sub}</p>` : ''}</div>
      ${ok.length > 1 ? html`<div class="kindsw" role="radiogroup" aria-label="Diagrammart für ${spec.title}">${ok.map(k => html`<button type="button" role="radio" aria-checked="${String(k === kind)}" data-act="chartKind" data-chart="${spec.id}" data-kind="${k}" aria-label="${VZ_KINDS[k].label}" data-tip="${tipAttr(VZ_KINDS[k].label, [])}">${ic(VZ_KINDS[k].icon)}</button>`)}</div>` : ''}</div>
    ${spec.extra || ''}
    <div class="vz-body">${vizBody(spec, kind)}</div>
    ${spec.note ? html`<p class="small muted">${spec.note}</p>` : ''}
  </section>`;
}

ACT.chartKind = async el => {
  const spec = CHARTS[el.dataset.chart];
  if (!spec) return;
  S.settings.chartKinds = S.settings.chartKinds || {};
  S.settings.chartKinds[spec.id] = el.dataset.kind;
  const card = el.closest('.chart');
  const holder = document.createElement('div');
  holder.innerHTML = vizCard(spec).s;
  const fresh = holder.firstElementChild;
  card.replaceWith(fresh);
  const nb = fresh.querySelector(`[data-kind="${el.dataset.kind}"]`);
  if (nb) { try { nb.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
  Tip.hide();
  try { await saveSettings(); } catch (e) { /* ignore */ }
};

/* Kleine Hilfen für die Aufbereitung */
function monthKeys(n, endKey) {
  const now = endKey ? parseDate(`${endKey}-01`) : new Date();
  const keys = [];
  for (let i = n - 1; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); keys.push(`${d.getFullYear()}-${pad2(d.getMonth() + 1)}`); }
  return keys;
}
const monthRow = (k, v, extra = {}) => { const [y, m] = k.split('-').map(Number); return Object.assign({ label: MONTHS_S[m - 1], tip: `${MONTHS[m - 1]} ${y}`, v }, extra); };

/* ---- 83-statscore.js ---- */
/* ==========================================================================
   Einsatzchronik – Rechenkern der Statistik (ohne Ansicht)
   Alle Kennzahlen werden aus den gespeicherten Einsätzen und Diensten berechnet.
   ========================================================================== */

const wdIdx = date => (parseDate(date).getDay() + 6) % 7;      // 0 = Montag
const WD_LONG = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
const WD_SHORT = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const PARTS = [
  { k: 'night', label: 'Nacht', long: 'Nachts (0 bis 6 Uhr)', from: 0, to: 6 },
  { k: 'morning', label: 'Morgen', long: 'Vormittags (6 bis 12 Uhr)', from: 6, to: 12 },
  { k: 'afternoon', label: 'Nachmittag', long: 'Nachmittags (12 bis 18 Uhr)', from: 12, to: 18 },
  { k: 'evening', label: 'Abend', long: 'Abends (18 bis 24 Uhr)', from: 18, to: 24 },
];
const partIdx = hour => Math.min(3, Math.floor(hour / 6));
const incHour = i => Number((i.time || '00:00').slice(0, 2));
const inc1 = (m, k, by = 1) => m.set(k, (m.get(k) || 0) + by);

/* Zeitraum und Bereich der Statistikseite */
const STAT_RANGES = [['all', 'Gesamt'], ['365', '12 Monate'], ['90', '90 Tage'], ['30', '30 Tage']];
function statFrom() {
  if (S.ui.statRange === 'all') return 0;
  const d = daysAgo(Number(S.ui.statRange) - 1); d.setHours(0, 0, 0, 0);
  return d.getTime();
}
const statIncidents = () => { const from = statFrom(); return S.incidents.filter(i => i.ts >= from && (!S.ui.statDomain || i.domain === S.ui.statDomain)); };
const statShifts = () => { const from = statFrom(); return S.shifts.filter(s => shiftStartTs(s) >= from && (!S.ui.statDomain || s.area === S.ui.statDomain)); };

function computeStats(incs) {
  const M = () => new Map();
  const st = {
    n: incs.length, dom: { fw: 0, rd: 0, dlrg: 0 },
    areaN: M(), areaMin: M(), minTotal: 0, minN: 0, longest: null,
    wd: Array(7).fill(0), hr: Array(24).fill(0), dd: Array(31).fill(0),
    tod: [0, 1, 2, 3].map(() => ({ fw: 0, rd: 0, dlrg: 0 })),
    crit: 0, critLv: M(), cpr: { n: 0, rosc: 0, no: 0, shocked: 0, by: M() }, ivSizes: M(), ivN: 0, vent: M(), airways: M(), cls: M(),
    doses: 0, procs: M(), acts: M(), dacts: M(), meds: M(), effects: M(),
    vehicles: M(), roles: M(), types: M(), dgroups: M(), scen: M(), tags: M(), kw: M(),
    learn: [0, 0, 0, 0, 0], learnSum: 0, learnN: 0, stressSum: 0, stressN: 0, photos: 0, proceduresN: 0, activitiesN: 0, withShift: 0,
    ioN: 0, tubeN: 0,
  };
  incs.forEach(i => {
    st.dom[i.domain]++;
    const areas = incAreas(i), min = incMinutes(i);
    areas.forEach(a => { inc1(st.areaN, a); if (min) inc1(st.areaMin, a, min / areas.length); });
    if (min) { st.minTotal += min; st.minN++; if (!st.longest || min > st.longest.min) st.longest = { inc: i, min }; }
    if (i.shiftId) st.withShift++;
    const h = incHour(i);
    st.wd[wdIdx(i.date)]++; st.hr[h]++; st.dd[Number(i.date.slice(8)) - 1]++;
    st.tod[partIdx(h)][i.domain]++;
    if (isCritical(i.criticality)) st.crit++;
    if (i.criticality) inc1(st.critLv, i.criticality);
    i.procedures.forEach(p => {
      inc1(st.procs, p.name); st.proceduresN++;
      if (p.special === 'iv') (p.sizes || ['']).forEach(sz => { st.ivN++; if (sz) inc1(st.ivSizes, sz); });
      if (p.special === 'io') st.ioN++;
      if (p.special === 'vent' && ventOf(p.vent)) inc1(st.vent, ventOf(p.vent).label);
      if (p.special === 'airway' && p.airway && p.airway.method) {
        inc1(st.airways, airwayMethodOf(p.airway.method).label);
        if (p.airway.cl) inc1(st.cls, p.airway.cl);
        if (airwayMethodOf(p.airway.method).group === 'et') st.tubeN++;
      }
      if (p.special === 'cpr') {
        const c = p.cpr || blankCpr(), k = c.rhythm || 'none';
        let e = st.cpr.by.get(k);
        if (!e) { e = { n: 0, rosc: 0, no: 0 }; st.cpr.by.set(k, e); }
        st.cpr.n++; e.n++;
        if (c.energy !== '' || c.count !== '') st.cpr.shocked++;
        if (c.rosc === 'yes') { st.cpr.rosc++; e.rosc++; } else if (c.rosc === 'no') { st.cpr.no++; e.no++; }
      }
    });
    i.activities.forEach(a => { inc1(dlrgGroupOf(a.group) ? st.dacts : st.acts, a.name); st.activitiesN++; });
    i.dlrgGroups.forEach(g => inc1(st.dgroups, (dlrgGroupOf(g) || { label: g }).label));
    i.scenarios.forEach(n => inc1(st.scen, n));
    i.medications.forEach(m => {
      let e = st.meds.get(m.name);
      if (!e) { e = { n: 0, inc: new Set(), sums: new Map() }; st.meds.set(m.name, e); }
      m.doses.forEach(x => {
        e.n++; st.doses++; e.inc.add(i.id);
        inc1(st.effects, x.effect || 'unrated');
        if (typeof x.dose === 'number' && !Number.isNaN(x.dose)) e.sums.set(x.unit, (e.sums.get(x.unit) || 0) + x.dose);
      });
    });
    if (i.vehicleType) inc1(st.vehicles, `${i.domain}|${i.vehicleType}`);
    if (i.role) inc1(st.roles, `${i.domain}|${i.role}`);
    i.types.forEach(t => inc1(st.types, `${i.domain}|${t}`));
    i.tags.forEach(t => inc1(st.tags, t));
    i.keywords.forEach(k => inc1(st.kw, k));
    if (i.ratingLearn) { st.learn[i.ratingLearn - 1]++; st.learnSum += i.ratingLearn; st.learnN++; }
    if (i.ratingStress) { st.stressSum += i.ratingStress; st.stressN++; }
    st.photos += i.photos.length;
  });
  return st;
}

/* Stichwort-Ranking: Schlagwörter, dazu die Einsatzarten (zum Beispiel „Brandschutz“, „Internistisch“) */
function keywordRanking(incs, n = 6) {
  const m = new Map();
  incs.forEach(i => { const seen = new Set(i.keywords.map(k => k.trim()).filter(Boolean)); seen.forEach(k => inc1(m, k)); });
  if (m.size < 3) incs.forEach(i => { new Set(i.types).forEach(t => inc1(m, t)); });
  return topEntries(m, n);
}

/* ---------- Dienste, Strecken und Kilometer ---------- */
const placeKey = s => (s.placeId || s.placeName || '').trim() || '–';
const placeNameOf = s => (s.placeId && placeById(s.placeId) ? placeById(s.placeId).name : s.placeName) || 'Ohne Dienststelle';

function computeShiftStats(shifts, incs) {
  const M = () => new Map();
  const r = {
    n: shifts.length, min: 0, km: 0, kmOne: 0, days: new Set(), areaMin: M(), areaN: M(), modeMin: M(), modeN: M(), modeKm: M(),
    byMonth: M(), places: M(), incInShift: 0, incMin: 0, withKm: 0, longest: null, mostInc: null, nights: 0,
    pausch: 0, wd: Array(7).fill(0),
  };
  const dayPlace = new Map();                    // je Tag und Dienststelle nur einmal (Entfernungspauschale)
  shifts.forEach(s => {
    const min = shiftMin(s), km = shiftKmDriven(s), t = shiftTripOf(s.trip);
    r.min += min; r.km += km;
    inc1(r.areaMin, s.area, min); inc1(r.areaN, s.area);
    inc1(r.modeMin, s.mode, min); inc1(r.modeN, s.mode); inc1(r.modeKm, s.mode, km);
    const mk = monthOf(s.date);
    let me = r.byMonth.get(mk); if (!me) { me = { n: 0, min: 0, km: 0 }; r.byMonth.set(mk, me); }
    me.n++; me.min += min; me.km += km;
    r.wd[wdIdx(s.date)]++;
    if (!r.longest || min > r.longest.min) r.longest = { shift: s, min };
    if (km > 0) r.withKm++;
    const pk = placeKey(s);
    let pe = r.places.get(pk);
    if (!pe) { pe = { name: placeNameOf(s), n: 0, km: 0, kmOne: s.km || 0, days: new Set(), min: 0, area: s.area }; r.places.set(pk, pe); }
    pe.n++; pe.km += km; pe.min += min; if (s.km) pe.kmOne = s.km;
    if (t.f > 0 && s.km > 0) { const dk = `${pk}|${s.date}`; if (!dayPlace.has(dk)) { dayPlace.set(dk, s.km); pe.days.add(s.date); } }
    const inc = incidentsOfShift(s.id).filter(i => incs.includes(i));
    r.incInShift += inc.length; r.incMin += inc.reduce((a, i) => a + incMinutes(i), 0);
    if (inc.length && (!r.mostInc || inc.length > r.mostInc.n)) r.mostInc = { shift: s, n: inc.length };
    const [h] = s.start.split(':').map(Number);
    if ((h >= 18 || h < 4) && diffDays(s.date, s.endDate) >= 1 && min >= 6 * 60) r.nights++;
  });
  r.pausch = Array.from(dayPlace.values()).reduce((a, km) => a + km, 0);       // Summe der einfachen Strecken je Tag
  r.pauschDays = dayPlace.size;
  return r;
}

/* Richtwerte für die Steuer: Entfernungspauschale (einfache Strecke je Tag) und Fahrtkosten (gefahrene Kilometer) */
const taxHints = (r) => {
  const rt = S.settings.rates || { pausch: 0.38, km: 0.30 };
  return { pausch: r.pausch * rt.pausch, kmgeld: r.km * rt.km, ratePausch: rt.pausch, rateKm: rt.km };
};

  /* 5. Spezielle Auswertungen (unten) */

      series: [{ k: 'n', label: 'Intubationen', color: DOM_COLOR.rd }], rows: CL_GRADES.map(c => ({ label: `Grad ${c.k}`, tip: `Grad ${c.k}: ${c.hint}`, v: [st.cls.get(c.k) || 0] })),

    }) : '',

/* ==========================================================================
   Einsatzchronik – Export (CSV, PDF), Backup und Import
   Dateien werden über die Download-Funktion des Viewers angeboten. Der Viewer fragt nach.
   ========================================================================== */

let DL_CAP;
async function getDownloads() {
  if (DL_CAP !== undefined) return DL_CAP;
  try { DL_CAP = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('downloads') : null; }
  catch (e) { DL_CAP = null; }
  return DL_CAP;
}

/* Liefert 'saved', 'declined', 'fallback' oder 'failed' */
async function saveFile(filename, data, mime = 'application/octet-stream') {
  const dl = await getDownloads();
  if (dl) {
    try { await dl.save({ filename, data }); return 'saved'; }
    catch (e) {
      const c = e && e.code;
      if (c === 'declined') return 'declined';
      if (c === 'rate_limited') return 'busy';
      if (c === 'too_large') { toast('Die Datei ist für diesen Speicherweg zu groß.', { ms: 5000 }); return 'quiet'; }
      console.warn('Download-Funktion fehlgeschlagen', e);
      return 'failed';
    }
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    if (isIOS()) { const r = await shareFileIOS(filename, blob, mime); if (r) return r; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    return 'fallback';
  } catch (e) { return 'failed'; }
}
/* iPhone und iPad: Dateien über das Teilen-Menü sichern (zum Beispiel in „Dateien“). Ein Download per Link klappt in der Home-Bildschirm-App nicht zuverlässig. */
const isIOS = () => /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
async function shareFileIOS(filename, blob, mime) {
  if (!navigator.share || !navigator.canShare) return null;
  let file = null;
  for (const t of [blob.type || mime, 'text/plain']) {
    try { const f = new File([blob], filename, { type: t }); if (navigator.canShare({ files: [f] })) { file = f; break; } } catch (e) { /* weiter */ }
  }
  if (!file) return null;
  try { await navigator.share({ files: [file], title: filename }); return 'saved'; }
  catch (e) {
    if (e && e.name === 'AbortError') return 'declined';
    // Die Berechtigung durch den Tipp ist abgelaufen: ein neuer Tipp startet das Teilen-Menü
    const ok = await confirmBox({ title: 'Datei bereit', text: `„${filename}“ ist fertig. Tippe auf „Sichern“, um sie über das Teilen-Menü zu speichern, zum Beispiel in „Dateien“.`, ok: 'Sichern' });
    if (!ok) return 'declined';
    try { await navigator.share({ files: [file], title: filename }); return 'saved'; }
    catch (e2) { return e2 && e2.name === 'AbortError' ? 'declined' : null; }
  }
}
function reportSave(res, what = 'Datei') {
  if (res === 'saved') toast(`${what} gespeichert`);
  else if (res === 'fallback') toast(`Download von ${what} gestartet`);
  else if (res === 'busy') toast('Es läuft schon eine Speicherabfrage. Bitte kurz warten und es noch einmal versuchen.', { ms: 5000 });
  else if (res === 'failed') toast('Speichern ist in dieser Ansicht nicht möglich.', { ms: 5000 });
}

/* ---------- PDF (eigener, schlanker Schreiber für Text mit Standardschrift Helvetica) ---------- */
const HELV = [278, 278, 355, 556, 556, 889, 667, 191, 333, 333, 389, 584, 278, 333, 278, 278, 556, 556, 556, 556, 556, 556, 556, 556, 556, 556, 278, 278, 584, 584, 584, 556, 1015,
  667, 667, 722, 722, 667, 611, 778, 722, 278, 500, 667, 556, 833, 722, 778, 667, 778, 722, 667, 611, 722, 667, 944, 667, 667, 611, 278, 278, 278, 469, 556, 333,
  556, 556, 500, 556, 556, 278, 556, 556, 222, 222, 500, 222, 833, 556, 556, 556, 556, 333, 500, 278, 556, 500, 722, 500, 500, 500, 334, 260, 334, 584];
const WINANSI = { '€': 0x80, '‚': 0x82, '„': 0x84, '…': 0x85, '†': 0x86, '‡': 0x87, '‰': 0x89, '‹': 0x8B, '‘': 0x91, '’': 0x92, '“': 0x93, '”': 0x94, '•': 0x95, '–': 0x96, '—': 0x97, '™': 0x99, '›': 0x9B, '−': 0x2D, '↵': 0x20 };
function pdfStr(s) {
  let o = '';
  for (const ch of String(s)) {
    const c = ch.codePointAt(0);
    let b;
    if (c >= 32 && c < 127) { if (ch === '(' || ch === ')' || ch === '\\') o += '\\' + ch; else o += ch; continue; }
    if (WINANSI[ch] != null) b = WINANSI[ch];
    else if (c >= 0xA0 && c <= 0xFF) b = c;
    else b = 0x3F;
    if (b < 127) o += (b === 0x28 || b === 0x29 || b === 0x5C) ? '\\' + String.fromCharCode(b) : String.fromCharCode(b);
    else o += '\\' + b.toString(8).padStart(3, '0');
  }
  return o;
}

function pdfDoc({ title }) {
  const PW = 595.28, PH = 841.89, M = 54, BOTTOM = 64;
  const pages = [];
  let cur = null, y = 0;
  const newPage = () => { cur = []; pages.push(cur); y = PH - M; };
  const tw = (s, size, bold) => { let t = 0; for (const ch of s) { const c = ch.charCodeAt(0); t += (c >= 32 && c <= 126) ? HELV[c - 32] : 556; } return t * size / 1000 * (bold ? 1.07 : 1); };
  const wrap = (text, size, bold, maxW) => {
    const lines = [];
    for (const para of String(text).split(/\r?\n/)) {
      let line = '';
      for (const word of para.split(/\s+/).filter(Boolean)) {
        const test = line ? line + ' ' + word : word;
        if (tw(test, size, bold) <= maxW) { line = test; continue; }
        if (line) lines.push(line);
        if (tw(word, size, bold) > maxW) {
          let chunk = '';
          for (const ch of word) { if (tw(chunk + ch, size, bold) > maxW) { lines.push(chunk); chunk = ch; } else chunk += ch; }
          line = chunk;
        } else line = word;
      }
      lines.push(line);
    }
    return lines;
  };
  const ensure = h => { if (!cur || y - h < BOTTOM) newPage(); };
  const api = {
    text(s, { size = 10.5, bold = false, gray = 0, indent = 0, gap = 0 } = {}) {
      const lh = size * 1.42;
      for (const ln of wrap(s, size, bold, PW - 2 * M - indent)) {
        ensure(lh); y -= lh;
        if (ln) cur.push(`BT /F${bold ? 2 : 1} ${size} Tf ${gray} g ${(M + indent).toFixed(2)} ${y.toFixed(2)} Td (${pdfStr(ln)}) Tj ET`);
      }
      y -= gap;
    },
    kv(k, v) {
      if (!v) return;
      const lh = 10.5 * 1.42;
      ensure(lh); y -= lh;
      cur.push(`BT /F2 9.5 Tf 0.4 g ${M} ${y.toFixed(2)} Td (${pdfStr(k)}) Tj ET`);
      const lines = wrap(v, 10.5, false, PW - 2 * M - 120);
      lines.forEach((ln, i) => { if (i) { ensure(lh); y -= lh; } cur.push(`BT /F1 10.5 Tf 0 g ${M + 120} ${y.toFixed(2)} Td (${pdfStr(ln)}) Tj ET`); });
    },
    h1(s) { api.text(s, { size: 17, bold: true, gap: 4 }); },
    h2(s) {
      y -= 10; ensure(30);
      api.text(s.toUpperCase(), { size: 9.5, bold: true, gray: 0.35, gap: 1 });
      cur.push(`0.5 w 0.75 G ${M} ${(y + 2).toFixed(2)} m ${PW - M} ${(y + 2).toFixed(2)} l S`);
      y -= 3;
    },
    gap(n = 6) { y -= n; },
    build() {
      if (!pages.length) newPage();
      const N = pages.length;
      pages.forEach((p, i) => p.push(`BT /F1 8 Tf 0.45 g ${M} 34 Td (${pdfStr(`Einsatzchronik · privates Lernarchiv · Seite ${i + 1} von ${N}`)}) Tj ET`));
      const objs = [];
      objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
      objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
      objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
      const kids = [];
      pages.forEach((p, i) => {
        const pg = 5 + i * 2, ct = pg + 1, stream = p.join('\n');
        kids.push(`${pg} 0 R`);
        objs[pg] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${ct} 0 R >>`;
        objs[ct] = `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;
      });
      objs[2] = `<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${N} >>`;
      const infoN = objs.length;
      objs[infoN] = `<< /Title (${pdfStr(title)}) /Producer (Einsatzchronik) >>`;
      let out = '%PDF-1.4\n';
      const offs = [];
      for (let i = 1; i < objs.length; i++) { offs[i] = out.length; out += `${i} 0 obj\n${objs[i]}\nendobj\n`; }
      const xref = out.length;
      out += `xref\n0 ${objs.length}\n0000000000 65535 f \n`;
      for (let i = 1; i < objs.length; i++) out += `${String(offs[i]).padStart(10, '0')} 00000 n \n`;
      out += `trailer\n<< /Size ${objs.length} /Root 1 0 R /Info ${infoN} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
      const u = new Uint8Array(out.length);
      for (let i = 0; i < out.length; i++) u[i] = out.charCodeAt(i) & 0xFF;
      return u;
    },
  };
  return api;
}

function incidentPdf(inc) {
  const p = pdfDoc({ title: `Einsatzbericht ${fmtDateShort(inc.date)}` });
  p.text('EINSATZBERICHT', { size: 9.5, bold: true, gray: 0.4 });
  p.h1(incTitle(inc));
  p.gap(4);
  p.kv('Datum und Uhrzeit', `${fmtDateLong(inc.date)}, ${inc.time} Uhr`);
  p.kv('Bereich', DOMAIN[inc.domain].label);
  if (endInfo(inc).ts) p.kv('Ende und Dauer', `${fmtDateShort(endInfo(inc).endDate)}, ${inc.endTime} Uhr · ${fmtDur(incMinutes(inc))}`);
  p.kv('Dienst', shiftText(inc.shiftId));
  p.kv('Fahrzeug', [inc.vehicleType, inc.callsign].filter(Boolean).join(', '));
  p.kv('Eigene Funktion', inc.role);
  if (inc.domain === 'rd') p.kv('Kritikalität', critLabel(inc.criticality) === '–' ? '' : critLabel(inc.criticality));
  p.kv('Einsatzart', inc.types.join(', '));
  if (inc.domain === 'dlrg') { p.kv('Fachbereich', inc.dlrgGroups.map(g => (dlrgGroupOf(g) || { label: g }).label).join(', ')); p.kv('Einsatzszenario', inc.scenarios.join(', ')); }
  p.kv('Meldebild', inc.dispatch);
  [['Wie hat sich die Lage dargestellt?', inc.description], ['Was war besonders?', inc.special], ['Was habe ich selbst gemacht?', inc.ownActions]].forEach(([t, v]) => { if (v) { p.h2(t); p.text(v); } });
  if (inc.procedures.length) {
    p.h2('Maßnahmen');
    inc.procedures.forEach(x => {
      p.text(`•  ${x.name} (${(roleOf(x.role) || { long: '' }).long})${x.note ? ' – ' + x.note : ''}`, { indent: 6 });
      const dt = procDetail(x);
      if (dt) p.text(dt, { indent: 16, size: 10, gray: 0.3 });
    });
  }
  ACT_GROUPS.forEach(g => {
    const items = inc.activities.filter(a => a.group === g.k);
    if (!items.length) return;
    p.h2(`Tätigkeiten · ${g.label}`);
    items.forEach(a => p.text(`•  ${a.name}${a.note ? ' – ' + a.note : ''}`, { indent: 6 }));
  });
  const meds = inc.medications.filter(m => m.doses.length);
  if (meds.length) {
    p.h2('Medikamentengaben');
    meds.forEach(m => {
      p.text(m.name, { bold: true, size: 10.5 });
      m.doses.slice().sort((a, b) => (a.time || '').localeCompare(b.time || '')).forEach((d, k) => {
        p.text(`Gabe ${k + 1}: ${d.time || '–'} Uhr · ${doseStr(d)}${d.route ? ' ' + d.route : ''} · ${effectOf(d.effect).label}${d.note ? ' · ' + d.note : ''}`, { indent: 10, size: 10 });
      });
      const t = medTotals(m);
      if (m.doses.length > 1 && t) p.text(`Gesamt: ${t}`, { indent: 10, size: 10, bold: true });
      p.gap(3);
    });
  }
  if (inc.tags.length || inc.keywords.length) { p.h2('Kategorien und Schlagwörter'); p.text([...inc.tags, ...inc.keywords].join(', ')); }
  if (inc.ratingLearn || inc.ratingStress || inc.learned || inc.notes) {
    p.h2('Reflexion');
    if (inc.ratingLearn) p.text(`Gelernt: ${inc.ratingLearn} von 5 (${LEARN_LABELS[inc.ratingLearn]})`);
    if (inc.ratingStress) p.text(`Belastung: ${inc.ratingStress} von 5 (${STRESS_LABELS[inc.ratingStress]})`);
    if (inc.learned) { p.gap(3); p.text('Lernerfahrung', { bold: true }); p.text(inc.learned); }
    if (inc.notes) { p.gap(3); p.text('Persönliche Notizen', { bold: true }); p.text(inc.notes); }
  }
  p.gap(10);
  p.text(`Erstellt am ${fmtStamp(Date.now())}. Privates Lernarchiv, keine offizielle Einsatz- oder Patientendokumentation. Fotos sind in dieser Datei nicht enthalten.`, { size: 8.5, gray: 0.45 });
  return p.build();
}

function mergeLists(into, add) {
  const have = new Set();
  for (const k of Object.keys(add)) {
    if (k === 'units' || k === 'routes') { add[k].forEach(v => { if (!into[k].includes(v)) into[k].push(v); }); continue; }
    have.clear(); into[k].forEach(x => have.add(x.id));
    add[k].forEach(x => { if (!have.has(x.id)) into[k].push(x); });
  }
}

async function importBackupFile(file) {
  if (file.size > 600 * 1024 * 1024) throw new Error('Die Datei ist zu groß.');
  let obj;
  try { obj = JSON.parse(await readFileText(file)); } catch (e) { throw new Error('Die Datei ist keine gültige Backup-Datei.'); }
  if (!isObj(obj) || obj.app !== APP_ID) throw new Error('Das ist kein Backup der Einsatzchronik.');
  if (obj.enc) {
    if (!CRY.ok()) throw new Error('Entschlüsselung ist in diesem Browser nicht verfügbar.');
    let inner = null;
    for (let tries = 0; tries < 5 && !inner; tries++) {
      const r = await formBox({
        title: 'Backup entschlüsseln', intro: tries ? 'Das Passwort war falsch oder die Datei ist beschädigt. Versuche es noch einmal.' : 'Dieses Backup ist verschlüsselt.',
        fields: [{ key: 'pw', type: 'password', label: 'Passwort', required: true }], submit: 'Entschlüsseln',
      });
      if (!r) return null;
      try { inner = JSON.parse(await CRY.decryptText(obj, r.pw)); } catch (e) { inner = null; }
    }
    if (!inner) throw new Error('Das Backup konnte nicht entschlüsselt werden.');
    obj = inner;
    if (!isObj(obj) || obj.app !== APP_ID) throw new Error('Das entschlüsselte Backup ist ungültig.');
  }
  const incs = sarr(obj.incidents).map(sanitizeIncident).filter(Boolean);
  const shiftsIn = sarr(obj.shifts).slice(0, 20000).map(sanitizeShift).filter(Boolean);
  if (!incs.length && !shiftsIn.length) throw new Error('Das Backup enthält keine lesbaren Einsätze oder Dienste.');
  const mode = await choiceBox({
    title: 'Backup einspielen',
    text: `Das Backup enthält ${plural(incs.length, 'Einsatz', 'Einsätze')}${shiftsIn.length ? ` und ${plural(shiftsIn.length, 'Dienst', 'Dienste')}` : ''} (erstellt am ${fmtStamp(Number(obj.exportedAt) || 0)}). Wie soll es eingespielt werden?`,
    choices: [
      { v: 'merge', label: 'Mit vorhandenen Daten zusammenführen', kind: 'primary' },
      { v: 'replace', label: 'Alle vorhandenen Einsätze ersetzen', kind: 'danger' },
      { v: 'cancel', label: 'Abbrechen', kind: 'ghost' },
    ],
  });
  if (!mode) return null;
  if (mode === 'replace') {
    const ok = await confirmBox({ title: 'Alle Einsätze ersetzen?', text: `Die ${plural(S.incidents.length, 'vorhandenen Einsatz', 'vorhandenen Einsätze')}, ${plural(S.shifts.length, 'Dienst', 'Dienste')} und alle Fotos werden gelöscht und durch das Backup ersetzt.`, ok: 'Ersetzen', danger: true });
    if (!ok) return null;
    await DB.clear('incidents'); await DB.clear('photos'); await DB.clear('thumbs');
    S.incidents = []; S.shifts = []; await saveShifts(); invalidateCaches();
  }
  const photoMap = new Map(sarr(obj.photos).filter(isObj).map(p => [p.id, p]));
  const thumbMap = new Map(sarr(obj.thumbs).filter(isObj).map(p => [p.id, p]));
  let added = 0, updated = 0, skipped = 0;
  for (const raw0 of incs) {
    const existing = S.incidents.find(i => i.id === raw0.id);
    if (existing && existing.updatedAt >= raw0.updatedAt) { skipped++; continue; }
    const keep = [];
    for (const p of raw0.photos) {
      const ph = photoMap.get(p.id), th = thumbMap.get(p.id);
      const full = ph ? safeImgSrc(ph.data) : '';
      if (!full || full.length > 12 * 1024 * 1024) continue;
      await DB.put('photos', { id: p.id, data: full });
      const t = th ? safeImgSrc(th.data) : '';
      if (t) await DB.put('thumbs', { id: p.id, data: t });
      THUMB_CACHE.delete(p.id);
      keep.push(p);
    }
    raw0.photos = keep;
    const rec = normalizeIncident(raw0);
    rec.ts = toTs(rec.date, rec.time);
    await DB.put('incidents', rec);
    const idx = S.incidents.findIndex(i => i.id === rec.id);
    if (idx >= 0) { S.incidents[idx] = rec; updated++; } else { S.incidents.push(rec); added++; }
  }
  let shiftsDone = 0;
  for (const sh of shiftsIn) {
    const ex = S.shifts.findIndex(x => x.id === sh.id);
    if (ex >= 0) { if (S.shifts[ex].updatedAt >= sh.updatedAt) continue; S.shifts[ex] = sh; } else S.shifts.push(sh);
    shiftsDone++;
  }
  await saveShifts();
  await patchIncidents(i => { if (i.shiftId && !shiftById(i.shiftId)) { i.shiftId = ''; return true; } return false; });
  invalidateCaches();
  const addLists = sanitizeLists(obj.lists);
  if (mode === 'replace') {
    const base = buildDefaultLists();
    S.lists = base;
  }
  mergeLists(S.lists, addLists);
  await saveLists();
  if (isObj(obj.settings) && mode === 'replace') {
    const o = obj.settings;
    if (o.theme === 'dark' || o.theme === 'light' || o.theme === 'system') S.settings.theme = o.theme;
    if (isObj(o.rates)) { const r = Number(o.rates.pausch), k = Number(o.rates.km); S.settings.rates = { pausch: Number.isFinite(r) ? clamp(r, 0, 5) : 0.38, km: Number.isFinite(k) ? clamp(k, 0, 5) : 0.30 }; }
    if (isObj(o.chartKinds)) { const ck = {}; Object.keys(o.chartKinds).slice(0, 200).forEach(key => { const v = o.chartKinds[key]; if (typeof v === 'string' && v.length <= 12 && key.length <= 60) ck[key] = v; }); S.settings.chartKinds = ck; }
    applyTheme(); await saveSettings();
  }
  return { added, updated, skipped, total: incs.length, shifts: shiftsDone, shiftsTotal: shiftsIn.length };
}

/* ---------- Beispieldaten und Standardlisten ---------- */
async function restoreDefaultLists() {
  const def = buildDefaultLists();
  let n = 0;
  for (const k of Object.keys(def)) {
    if (k === 'units' || k === 'routes') { def[k].forEach(v => { if (!S.lists[k].includes(v)) { S.lists[k].push(v); n++; } }); continue; }
    const have = new Set(S.lists[k].map(x => x.id));
    const byName = (k === 'procedures' || k === 'medications') ? new Set(S.lists[k].map(x => norm(x.name))) : null;
    def[k].forEach(x => { if (!have.has(x.id) && !(byName && byName.has(norm(x.name)))) { S.lists[k].push(x); n++; } });
  }
  await saveLists();
  return n;
}

/* ==========================================================================
   Einsatzchronik – Auswertung mit Erkenntnissen
   1. Regelbasierte Hinweise, direkt auf dem Gerät berechnet (immer verfügbar).
   2. Optional eine KI-Auswertung: in der Claude-App über die Funktion „sample“, sonst als kopierbare Zusammenfassung,
      die man selbst in Claude einfügen kann. Es werden nur zusammengefasste Zahlen weitergegeben, keine Texte, Namen oder Fotos.
   ========================================================================== */

const scopeLabel = () => `${(STAT_RANGES.find(r => r[0] === S.ui.statRange) || [, 'Gesamt'])[1]}, ${S.ui.statDomain ? DOMAIN[S.ui.statDomain].label : 'alle Bereiche'}`;
const sumMap = m => Array.from(m.values()).reduce((a, b) => a + b, 0);
const maxIdx = a => a.reduce((bi, v, i) => (v > a[bi] ? i : bi), 0);

/* Spitzname für die Stoßzeit: Wochentag und Tageszeit */
function peakTitle(wd, part) {
  const day = WD_LONG[wd];
  return [`${day}nacht-Einsatzheld`, `${day}morgen-Frühaufsteher`, `${day}nachmittag-Dauerbereiter`, `${day}abend-Feierabendretter`][part];
}

function buildInsights(ctx) {
  const { st, ss, incs } = ctx, out = [];
  const add = (icon, tone, title, text) => out.push({ icon, tone, title, text });
  const n = st.n;
  if (!n) return out;

  /* Entwicklung: letzte 30 Tage gegenüber den 30 Tagen davor (unabhängig vom gewählten Zeitraum) */
  const base = S.incidents.filter(i => !S.ui.statDomain || i.domain === S.ui.statDomain);
  const t0 = Date.now(), d30 = 30 * 86400000;
  const last = base.filter(i => i.ts >= t0 - d30 && i.ts <= t0).length, prev = base.filter(i => i.ts >= t0 - 2 * d30 && i.ts < t0 - d30).length;
  if (last + prev >= 3) {
    const diff = last - prev;
    add('bars', 'info', 'Entwicklung', diff === 0 ? `In den letzten 30 Tagen waren es ${plural(last, 'Einsatz', 'Einsätze')}, genauso viele wie in den 30 Tagen davor.`
      : `In den letzten 30 Tagen waren es ${plural(last, 'Einsatz', 'Einsätze')}: ${Math.abs(diff)} ${diff > 0 ? 'mehr' : 'weniger'} als in den 30 Tagen davor (${prev}).`);
  }

  /* Stoßzeiten */
  if (n >= 6) {
    const wi = maxIdx(st.wd), pi = maxIdx(st.tod.map(t => t.fw + t.rd + t.dlrg));
    const wdShare = pct(st.wd[wi], n), pShare = pct(st.tod[pi].fw + st.tod[pi].rd + st.tod[pi].dlrg, n);
    add('clock', 'info', 'Stoßzeit', `Am häufigsten beginnen deine Einsätze am ${WD_LONG[wi]} (${wdShare} % aller Einsätze) und ${PARTS[pi].long.replace(/^./, c => c.toLowerCase())} (${pShare} %). Dein Titel: „${peakTitle(wi, pi)}“.`);
    const nightN = st.tod[0].fw + st.tod[0].rd + st.tod[0].dlrg;
    if (pct(nightN, n) >= 30) add('moon', 'info', 'Nachts gefragt', `${pct(nightN, n)} % deiner Einsätze beginnen zwischen 0 und 6 Uhr. Ausreichend Schlaf und Erholung nach Nachtdiensten helfen, das auf Dauer gut zu tragen.`);
  }

  /* Bereiche und Stunden */
  const areas = Array.from(st.areaN.entries()).sort((a, b) => b[1] - a[1]);
  if (areas.length > 1) {
    const [k, v] = areas[0];
    add('grid', 'info', 'Schwerpunkt', `Dein größter Bereich ist ${AREAS.find(a => a.k === k).label}: ${plural(v, 'Einsatz', 'Einsätze')} (${pct(v, n)} %). Ein Einsatz mit Brand- und Technischer Hilfe zählt in beiden Bereichen.`);
  }
  if (st.minN >= 3) {
    const avg = st.minTotal / st.minN;
    add('clock', 'info', 'Einsatzzeit', `Für ${plural(st.minN, 'Einsatz', 'Einsätze')} mit erfasstem Ende kommen ${fmtDur(st.minTotal)} zusammen, im Schnitt ${fmtDur(avg)} je Einsatz. Der längste dauerte ${fmtDur(st.longest.min)}.`);
  }
  if (n >= 5 && st.minN / n < 0.7) {
    add('alert', 'warn', 'Lücken in den Daten', `Bei ${n - st.minN} von ${n} Einsätzen fehlt das Einsatzende. Die Stunden-Auswertung ist dadurch unvollständig. Das Ende lässt sich im Einsatz nachtragen (Schritt 5).`);
  }

  /* Rettungsdienst */
  if (st.cpr.n) {
    const known = st.cpr.rosc + st.cpr.no;
    add('cross', 'info', 'Reanimationen', `${plural(st.cpr.n, 'Reanimation', 'Reanimationen')} dokumentiert${known ? `, ROSC in ${st.cpr.rosc} von ${known} Fällen mit Ergebnis (${pct(st.cpr.rosc, known)} %)` : ''}. ${known < 10 ? 'Bei dieser kleinen Zahl sagt die Quote wenig aus. Wichtiger ist, was du aus den einzelnen Einsätzen mitnimmst.' : 'Das ist eine persönliche Übersicht und kein Qualitätsvergleich.'}`);
  }
  const tubes = sumMap(st.cls);
  if (tubes >= 3) {
    const hard = (st.cls.get('III') || 0) + (st.cls.get('IV') || 0);
    add('search', hard ? 'warn' : 'info', 'Sicht bei Intubation', `Bei ${tubes} Intubationen mit Angabe war die Sicht ${hard ? `${hard}-mal nur eingeschränkt (Grad III oder IV, zum Beispiel nur die Epiglottis sichtbar). Das spricht dafür, den schwierigen Atemweg regelmäßig zu üben` : 'meist gut (Grad I bis II). Halte die Routine mit regelmäßigem Training aufrecht'}.`);
  }
  if (st.doses >= 5) {
    const top = topEntries(new Map(Array.from(st.meds.entries()).map(([k, v]) => [k, v.n])), 1)[0];
    const open = st.effects.get('unrated') || 0;
    add('pill', open / st.doses > 0.3 ? 'warn' : 'info', 'Medikamente', `${plural(st.doses, 'Gabe', 'Gaben')} aus ${plural(st.meds.size, 'Medikament', 'Medikamenten')}, am häufigsten ${top[0]} (${top[1]}×). ${open / st.doses > 0.3 ? `Bei ${open} Gaben (${pct(open, st.doses)} %) ist die Wirkung nicht bewertet. Wer die Wirkung nachträgt, lernt aus den eigenen Einsätzen mehr.` : ''}`.trim());
  }

  /* Lernen und Belastung */
  if (st.learnN >= 4 && st.stressN >= 4) {
    const hi = incs.filter(i => i.ratingStress >= 4 && i.ratingLearn);
    if (hi.length >= 3) {
      const avgHi = hi.reduce((a, i) => a + i.ratingLearn, 0) / hi.length;
      add('star', 'info', 'Belastung und Lernen', `${plural(hi.length, 'stark belastender Einsatz', 'stark belastende Einsätze')} brachten dir im Schnitt ${fmtNum(avgHi, 1)} von 5 Punkten beim Lernen (alle Einsätze: ${avgStr(st.learnSum, st.learnN)}). ${st.stressSum / st.stressN >= 3.5 ? 'Deine Belastung liegt insgesamt hoch. Gespräche mit Kameraden oder eine Nachbesprechung können entlasten.' : ''}`.trim());
    }
  }

  /* Dienste */
  if (ss && ss.n >= 3) {
    const per = ss.incInShift / ss.n;
    add('calendar', 'info', 'Dienste', `${plural(ss.n, 'Dienst', 'Dienste')} mit zusammen ${fmtHours(ss.min)}. ${ss.incInShift ? `In den Diensten hattest du im Schnitt ${fmtNum(per, 1)} Einsätze, die Einsatzzeit macht ${pct(ss.incMin, ss.min)} % der Dienstzeit aus.` : 'Noch kein Einsatz ist einem Dienst zugeordnet.'}`);
    if (ss.km > 0) add('route', 'info', 'Anfahrt', `${fmtKm(ss.km)} Anfahrt in ${plural(ss.withKm, 'Dienst', 'Diensten')}. Richtwert für die Steuer: ${fmtEur(taxHints(ss).pausch)} (Entfernungspauschale) oder ${fmtEur(taxHints(ss).kmgeld)} (gefahrene Kilometer). Das ist keine Steuerberatung.`);
  }
  if (n >= 3 && st.withShift / n < 0.5 && S.shifts.length) {
    add('alert', 'warn', 'Dienste zuordnen', `${n - st.withShift} von ${n} Einsätzen gehören zu keinem Dienst. Beim Eintragen schlägt die App den laufenden Dienst automatisch vor.`);
  }
  return out;
}

  if (st.learnN) L.push(`Selbsteinschätzung: gelernt Ø ${avgStr(st.learnSum, st.learnN)} von 5, Belastung Ø ${avgStr(st.stressSum, st.stressN)} von 5`);
  if (ss && ss.n) L.push(`Dienste: ${ss.n}, ${fmtHours(ss.min)}, davon Einsätze im Dienst ${ss.incInShift}${ss.km ? `, Anfahrt ${fmtKm(ss.km)}` : ''}`);
  return L.join('\n');
}

  const ok = await confirmBox({ title: 'KI-Auswertung', text: 'Claude erhält nur zusammengefasste Zahlen aus der aktuellen Auswahl: Anzahlen, Häufigkeiten und Durchschnitte. Keine Texte, Namen, Fotos oder einzelnen Einsätze.', ok: 'Auswerten' });
  if (!ok) return;
  AI_BUSY = true; AI_CTRL = new AbortController();
  out.hidden = false; out.textContent = 'Claude wertet aus …';
  $('#ai-btn').disabled = true;
  try {
    const r = await sample(AI_PROMPT + statSummaryText(ctx), { signal: AI_CTRL.signal, cache: false, onText: ({ text }) => { out.textContent = text; } });
    out.textContent = r.text || 'Keine Antwort erhalten.';
  } catch (e) {
    const c = e && e.code;
    out.textContent = e && e.text ? e.text : '';
    if (c === 'not_granted') { out.hidden = true; $('#ai-btn').hidden = true; toast('Die KI-Auswertung wurde nicht freigegeben.'); }
    else if (c === 'rate_limited') toast('Bitte einen Moment warten und es dann noch einmal versuchen.', { ms: 5000 });
    else if (!out.textContent) { out.hidden = true; toast('Die KI-Auswertung hat nicht geklappt. Du kannst die Zusammenfassung stattdessen kopieren.', { ms: 5200 }); }
  } finally { AI_BUSY = false; AI_CTRL = null; const b = $('#ai-btn'); if (b) b.disabled = false; }
};

async function copyText(text) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; } } catch (e) { /* weiter mit Ersatz */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}

function kmYears() {

/* ---- 88-wrapped.js ---- */
/* ==========================================================================
   Einsatzchronik – Jahresrückblick („Wrapped“) mit Heatmap, Stoßzeiten, Stichwörtern, Rekorden und Bild zum Teilen
   ========================================================================== */

/* ---------- Persönliche Rekorde (für Rückblick und Erfolge) ---------- */
function computeRecords(incs, shifts) {
  const r = { busyMonth: null, longestInc: null, busyDay: null, streak: null, longestShift: null, mostIncShift: null, hardest: null };
  const byMonth = new Map(), byDay = new Map();
  incs.forEach(i => {
    const k = monthKey(i.date), e = byMonth.get(k) || { k, n: 0, min: 0 };
    e.n++; e.min += incMinutes(i); byMonth.set(k, e);
    byDay.set(i.date, (byDay.get(i.date) || 0) + 1);
    const m = incMinutes(i);
    if (m && (!r.longestInc || m > r.longestInc.min)) r.longestInc = { inc: i, min: m };
    if (i.ratingStress && (!r.hardest || i.ratingStress > r.hardest.inc.ratingStress || (i.ratingStress === r.hardest.inc.ratingStress && incMinutes(i) > incMinutes(r.hardest.inc)))) r.hardest = { inc: i };
  });
  Array.from(byMonth.values()).forEach(e => { if (!r.busyMonth || e.n > r.busyMonth.n || (e.n === r.busyMonth.n && e.min > r.busyMonth.min)) r.busyMonth = e; });
  byDay.forEach((n, d) => { if (!r.busyDay || n > r.busyDay.n) r.busyDay = { date: d, n }; });
  const days = Array.from(byDay.keys()).sort();
  let run = 0, best = null, from = '';
  days.forEach((d, i) => {
    if (i > 0 && diffDays(days[i - 1], d) === 1) run++; else { run = 1; from = d; }
    if (!best || run > best.len) best = { len: run, from, to: d };
  });
  r.streak = best;
  shifts.forEach(s => {
    const m = shiftMin(s);
    if (!r.longestShift || m > r.longestShift.min) r.longestShift = { shift: s, min: m };
    const n = incs.filter(i => i.shiftId === s.id).length;
    if (n && (!r.mostIncShift || n > r.mostIncShift.n)) r.mostIncShift = { shift: s, n };
  });
  return r;
}
/* Längste Folge von Kalenderwochen mit mindestens einem Einsatz */
function weekStreak(incs) {
  const weeks = Array.from(new Set(incs.map(i => addDays(i.date, -wdIdx(i.date))))).sort();
  let run = 0, best = 0;
  weeks.forEach((w, i) => { run = (i > 0 && diffDays(weeks[i - 1], w) === 7) ? run + 1 : 1; best = Math.max(best, run); });
  return best;
}

function recordRows(rec, shiftsOnly) {
  const L = [];
  const dt = d => fmtDateShort(d);
  if (rec.busyMonth) L.push(['calendar', 'Anstrengendster Monat', monthLabel(rec.busyMonth.k), `${plural(rec.busyMonth.n, 'Einsatz', 'Einsätze')}${rec.busyMonth.min ? `, ${fmtHours(rec.busyMonth.min)}` : ''}`]);
  if (rec.longestInc) L.push(['clock', 'Längster Einsatz am Stück', fmtDur(rec.longestInc.min), `${dt(rec.longestInc.inc.date)} · ${truncate(incTitle(rec.longestInc.inc), 50)}`, rec.longestInc.inc.id]);
  if (rec.busyDay && rec.busyDay.n > 1) L.push(['bars', 'Meiste Einsätze an einem Tag', `${rec.busyDay.n} Einsätze`, fmtDateLong(rec.busyDay.date)]);
  if (rec.streak && rec.streak.len > 1) L.push(['flame', 'Längste Serie', `${rec.streak.len} Tage in Folge`, `${dt(rec.streak.from)} bis ${dt(rec.streak.to)}`]);
  if (rec.hardest && rec.hardest.inc.ratingStress >= 4) L.push(['alert', 'Belastendster Einsatz', `${rec.hardest.inc.ratingStress} von 5`, `${dt(rec.hardest.inc.date)} · ${truncate(incTitle(rec.hardest.inc), 50)}`, rec.hardest.inc.id]);
  if (rec.mostIncShift && rec.mostIncShift.n > 1) L.push(['truck', 'Meiste Einsätze in einem Dienst', `${rec.mostIncShift.n} Einsätze`, `${shiftLabel(rec.mostIncShift.shift)}, ${dt(rec.mostIncShift.shift.date)}`]);
  if (rec.longestShift && rec.longestShift.min >= 12 * 60) L.push(['calendar', 'Längster Dienst', fmtDur(rec.longestShift.min), `${shiftLabel(rec.longestShift.shift)}, ${dt(rec.longestShift.shift.date)}`]);
  return L;
}
function recordsCard(rec, title = 'Persönliche Rekorde') {
  const rows = recordRows(rec);
  if (!rows.length) return '';
  return html`<section class="card rec"><div class="chart-h"><div><h3>${ic('trophy')} ${title}</h3></div></div>
    <div class="rec-l">${rows.map(([icon, label, val, sub, id]) => html`${id ? html`<button type="button" class="rec-r" data-act="open" data-id="${id}">` : raw('<div class="rec-r">')}<span class="rec-i">${ic(icon)}</span><span class="rec-t"><small>${label}</small><b>${val}</b><em>${sub}</em></span>${id ? html`${ic('chevR')}</button>` : raw('</div>')}`)}</div></section>`;
}

/* ---------- Heatmap des Jahres ---------- */
function yearHeat(year, incs, color) {
  const counts = new Map();
  incs.forEach(i => counts.set(i.date, (counts.get(i.date) || 0) + 1));
  const first = `${year}-01-01`, last = `${year}-12-31`;
  const start = addDays(first, -wdIdx(first));
  const weeks = Math.ceil((diffDays(start, last) + 1) / 7);
  const max = Math.max(1, ...counts.values());
  const lvl = n => (n === 0 ? 0 : Math.min(4, Math.max(1, Math.ceil(n / max * 4))));
  const cells = [];
  for (let w = 0; w < weeks; w++) for (let d = 0; d < 7; d++) {
    const date = addDays(start, w * 7 + d);
    if (!date.startsWith(year)) { cells.push(html`<i class="hm-c off"></i>`); continue; }
    const n = counts.get(date) || 0;
    cells.push(n
      ? html`<i class="hm-c l${lvl(n)}" tabindex="0" role="img" aria-label="${fmtDateLong(date)}: ${plural(n, 'Einsatz', 'Einsätze')}" data-tip="${tipAttr(fmtDateLong(date), [{ s: color, v: String(n), l: n === 1 ? 'Einsatz' : 'Einsätze' }])}"></i>`
      : html`<i class="hm-c l0" data-tip="${tipAttr(fmtDateLong(date), [{ s: 'none', v: '0', l: 'Einsätze' }])}"></i>`);
  }
  const months = [];
  for (let m = 1; m <= 12; m++) { const d = `${year}-${pad2(m)}-01`; months.push({ m, col: Math.floor(diffDays(start, d) / 7) + 1 }); }
  const total = incs.length, days = counts.size;
  return html`<div class="hm-wrap" style="--heat:${color}">
    <div class="hm-scroll"><div class="hm" style="--w:${weeks}">

/* Wochentag mal Tageszeit */
function weekGrid(incs, color) {
  const m = Array.from({ length: 7 }, () => [0, 0, 0, 0]);
  incs.forEach(i => { m[wdIdx(i.date)][partIdx(incHour(i))]++; });

/* ---------- Aufbereitung für Ansicht und Bild ---------- */
function wrYears() {
  const ys = new Set([String(new Date().getFullYear())]);
  S.incidents.forEach(i => ys.add(i.date.slice(0, 4)));
  return Array.from(ys).sort().reverse();
}
function wrYearSel() {
  const years = wrYears();
  if (years.includes(S.ui.wrapYear)) return S.ui.wrapYear;
  const cur = String(new Date().getFullYear());
  return S.incidents.some(i => i.date.startsWith(cur)) ? cur : (years.find(y => S.incidents.some(i => i.date.startsWith(y))) || cur);
}
function wrData(y) {
  const incs = S.incidents.filter(i => i.date.startsWith(y));
  const shifts = S.shifts.filter(s => s.date.startsWith(y));
  const st = computeStats(incs), ss = computeShiftStats(shifts, incs);
  const wi = maxIdx(st.wd), pi = maxIdx(st.tod.map(t => t.fw + t.rd + t.dlrg));
  const kw = keywordRanking(incs, 5);
  return { y, incs, shifts, st, ss, rec: computeRecords(incs, shifts), wi, pi, title: st.n >= 3 ? peakTitle(wi, pi) : '', kw, demo: incs.some(i => i.demo) };
}
function wrShareText(d) {

}

/* ---------- Bild zum Teilen (Hochformat, ohne Namen oder Einzelheiten zu Einsätzen) ---------- */
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
async function drawWrapped(d) {
  const W = 1080, H = 1920, cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  try { await Promise.all([document.fonts.load('600 80px "Barlow Condensed"'), document.fonts.load('600 40px "Barlow"')]); } catch (e) { /* Standardschrift */ }
  const HEAD = '"Barlow Condensed", "Barlow", system-ui, sans-serif', BODY = '"Barlow", system-ui, sans-serif';
  const col = { fw: '#e66767', rd: '#3987e5', dlrg: '#c98500', text: '#f0efec', mut: '#9aa4b8' };
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0a0e16'); g.addColorStop(1, '#141c2e');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // Streifen oben in den Bereichsfarben
  const nm = DOM_KEYS.filter(k => d.st.dom[k]), tot = d.st.n;
  let x = 0;
  nm.forEach(k => { const w = (d.st.dom[k] / tot) * W; c.fillStyle = col[k]; c.fillRect(x, 0, w, 22); x += w; });
  const rr = (x0, y0, w, h, r) => { c.beginPath(); c.moveTo(x0 + r, y0); c.arcTo(x0 + w, y0, x0 + w, y0 + h, r); c.arcTo(x0 + w, y0 + h, x0, y0 + h, r); c.arcTo(x0, y0 + h, x0, y0, r); c.arcTo(x0, y0, x0 + w, y0, r); c.closePath(); };
  const txt = (s, x0, y0, font, color, align = 'left') => { c.font = font; c.fillStyle = color; c.textAlign = align; c.fillText(s, x0, y0); };
  txt('MEIN EINSATZJAHR', 80, 130, `600 44px ${HEAD}`, col.mut);
  txt(d.y, 80, 290, `600 170px ${HEAD}`, col.text);
  txt(String(d.st.n), 80, 510, `600 240px ${BODY}`, col.text);
  const nW = c.measureText(String(d.st.n)).width;
  txt(d.st.n === 1 ? 'Einsatz' : 'Einsätze', 80 + nW + 28, 510, `500 60px ${BODY}`, col.mut);
  if (d.st.minN) txt(`${fmtDur(d.st.minTotal)} im Einsatz`, 80, 584, `500 46px ${BODY}`, col.text);
  // Bereiche
  const areas = AREAS.filter(a => d.st.areaN.get(a.k));
  const ac = { brand: '#e66767', th: '#9085e9', fwother: '#199e70', rd: '#3987e5', dlrg: '#c98500' };
  const rowH = areas.length > 4 ? 82 : 100;
  let yy = 690;
  const maxN = Math.max(1, ...areas.map(a => d.st.areaN.get(a.k)));
  areas.forEach(a => {
    const n = d.st.areaN.get(a.k), mins = d.st.areaMin.get(a.k);
    txt(a.short || a.label, 80, yy, `500 42px ${BODY}`, col.text);
    txt(`${n} ${n === 1 ? 'Einsatz' : 'Einsätze'}${mins ? ` · ${fmtHours(mins)}` : ''}`, W - 80, yy, `500 38px ${BODY}`, col.mut, 'right');
    c.fillStyle = 'rgba(255,255,255,.08)'; rr(80, yy + 14, W - 160, 20, 10); c.fill();
    c.fillStyle = ac[a.k]; rr(80, yy + 14, Math.max(22, (W - 160) * n / maxN), 20, 10); c.fill();
    yy += rowH;
  });
  // Heatmap sitzt immer unten, davor Stoßzeit und Stichwort
  const first = `${d.y}-01-01`, start = addDays(first, -wdIdx(first)), weeks = Math.ceil((diffDays(start, `${d.y}-12-31`) + 1) / 7);
  const cs = (W - 160) / weeks, counts = new Map(); d.incs.forEach(i => counts.set(i.date, (counts.get(i.date) || 0) + 1));
  const mx = Math.max(1, ...counts.values()), top = H - 170 - 56 - 7 * cs;
  const hc = col[nm.slice().sort((a, b) => d.st.dom[b] - d.st.dom[a])[0]] || col.rd;
  /* Große Zeile: passt sie nicht in die Breite, wird sie am Bindestrich umgebrochen oder verkleinert */
  const fits = (t, sz) => { c.font = `600 ${sz}px ${HEAD}`; return c.measureText(t).width <= W - 160; };
  const bigPlan = (label, text) => {
    let size = 72, lines = [text];
    if (!fits(text, size) && text.includes('-')) { const k = text.indexOf('-') + 1; lines = [text.slice(0, k), text.slice(k)]; }
    while (size > 40 && !lines.every(t => fits(t, size))) size -= 4;
    return { label, lines, size, h: 76 + (lines.length - 1) * (size + 6) + 84 };
  };
  const plans = [];
  if (d.title) plans.push(bigPlan('DEINE STOSSZEIT', d.title));
  if (d.kw[0]) plans.push(bigPlan('STICHWORT DES JAHRES', truncate(d.kw[0][0], 28)));
  const blocksH = plans.reduce((a, p) => a + p.h, 0);
  yy = Math.max(yy + 30, top - 40 - blocksH);
  plans.forEach(p => {
    txt(p.label, 80, yy, `600 36px ${HEAD}`, col.mut);
    p.lines.forEach((t, k) => txt(t, 80, yy + 76 + k * (p.size + 6), `600 ${p.size}px ${HEAD}`, col.text));
    yy += p.h;
  });
  for (let w = 0; w < weeks; w++) for (let k = 0; k < 7; k++) {
    const date = addDays(start, w * 7 + k); if (!date.startsWith(d.y)) continue;
    const n = counts.get(date) || 0;
    c.globalAlpha = n ? 0.3 + 0.7 * Math.min(1, n / mx) : 1;
    c.fillStyle = n ? hc : 'rgba(255,255,255,.07)';
    rr(80 + w * cs + 1, top + k * cs + 1, cs - 3, cs - 3, 4); c.fill();
  }
  c.globalAlpha = 1;
  txt(`${counts.size} Tage mit Einsatz`, 80, top + 7 * cs + 56, `500 36px ${BODY}`, col.mut);
  txt('Einsatzchronik', W - 80, H - 90, `600 52px ${HEAD}`, col.text, 'right');
  if (d.demo) txt('Beispieldaten', 80, H - 90, `500 38px ${BODY}`, col.mut);
  return new Promise((res, rej) => cv.toBlob(b => (b ? res(b) : rej(new Error('Bild konnte nicht erstellt werden'))), 'image/png'));
}

/* Heatmap auf schmalen Bildschirmen: beim aktuellen Jahr zum heutigen Tag scrollen */
function heatScroll() {
  const sc = document.querySelector('.hm-scroll');
  if (!sc || sc.scrollWidth <= sc.clientWidth + 1) return;
  const y = wrYearSel(), now = todayStr();
  if (!now.startsWith(y)) { sc.scrollLeft = 0; return; }
  const first = `${y}-01-01`, col = Math.floor(diffDays(addDays(first, -wdIdx(first)), now) / 7);
  const weeks = Math.ceil((diffDays(addDays(first, -wdIdx(first)), `${y}-12-31`) + 1) / 7);
  sc.scrollLeft = Math.max(0, (col + 0.5) / weeks * sc.scrollWidth - sc.clientWidth * 0.7);
}

/* ---------- Berechnung ---------- */
function achCtx() {
  const incs = S.incidents.filter(i => !i.demo), shifts = S.shifts.filter(s => !s.demo);
  const st = computeStats(incs), ss = computeShiftStats(shifts, incs), rec = computeRecords(incs, shifts);
  const inH = (a, b) => incs.filter(i => { const h = incHour(i); return h >= a && h < b; }).length;
  const isPA = i => i.activities.some(a => /atemschutz|\(PA\)/i.test(a.name)) || i.keywords.some(k => /atemschutz/i.test(k));
  const holiday = i => ['12-24', '12-25', '12-26', '12-31', '01-01'].includes(i.date.slice(5));
  return {
    incs, shifts, st, ss, rec, n: incs.length, demoOnly: !incs.length && !shifts.length && (S.incidents.length > 0 || S.shifts.length > 0),
    night24: inH(2, 4), early: inH(4, 6), pa: incs.filter(isPA).length,
    holiday: incs.filter(holiday).length, weekend: incs.filter(i => wdIdx(i.date) >= 5).length,
    grp: id => incs.filter(i => i.dlrgGroups.includes(id)).length,
    weeks: incs.length ? weekStreak(incs) : 0, years: new Set(incs.map(i => i.date.slice(0, 4))).size,
    learned: incs.filter(i => String(i.learned || '').trim()).length, vol: shifts.filter(s => s.mode === 'volunteer').length,
  };
}
function achState(c) {
  return ACH.map(a => {
    const val = a.val(c) || 0, done = a.levels.filter(l => val >= l[0]).length;
    const next = a.levels[done] || null, prev = done ? a.levels[done - 1][0] : 0;
    return { a, val, done, next, prev, ratio: next ? (val - prev) / (next[0] - prev) : 1, total: a.levels.length };
  });
}
const achWhat = (a, n) => (Array.isArray(a.w) ? (n === 1 ? a.w[0] : a.w[1]) : a.w);
const achDesc = (a, l) => l[2] || `${(a.f || fmtInt1000)(l[0])} ${achWhat(a, l[0])}`;
const achCounts = states => ({ levels: states.reduce((s, x) => s + x.done, 0), total: states.reduce((s, x) => s + x.total, 0), series: states.filter(x => x.done).length });
const achNextUp = (states, n = 3) => states.filter(x => x.next && x.val > 0).sort((a, b) => b.ratio - a.ratio).slice(0, n);
const achGroup = k => ACH_GROUPS.find(g => g.k === k) || ACH_GROUPS[0];

/* ---------- Neue Abzeichen melden (nur ein Zähler je Abzeichen, nie rückwärts) ---------- */
function achDoneMap() {
  const m = {};
  achState(achCtx()).forEach(x => { m[x.a.id] = x.done; });
  return m;
}
async function announceBadges() {
  try {
    const now = achDoneMap(), seen = S.settings.badgesSeen, merged = {};
    ACH.forEach(a => { merged[a.id] = Math.max((seen && seen[a.id]) || 0, now[a.id] || 0); });
    S.settings.badgesSeen = merged;
    await saveSettings();
    if (!seen) return;                                     // erster Lauf: nur den Stand merken
    const fresh = [];
    ACH.forEach(a => { for (let k = seen[a.id] || 0; k < (now[a.id] || 0); k++) fresh.push(a.levels[k][1]); });
    if (!fresh.length) return;
    toast(fresh.length === 1 ? `Neues Abzeichen: ${fresh[0]}` : `${fresh.length} neue Abzeichen: ${fresh.slice(0, 2).join(', ')}${fresh.length > 2 ? ' …' : ''}`, {
      ms: 7000, action: { label: 'Ansehen', fn: () => { S.ui.statTab = 'erfolge'; go('stats', {}, { reset: true }); } },
    });
  } catch (e) { console.warn('Abzeichen', e); }
}

/* ---------- Ansicht ---------- */
const ACH_FILTERS = [['all', 'Alle'], ['done', 'Freigeschaltet'], ['open', 'Offen']];
function achRow(x) {
  const { a, val, done, next, total } = x, g = achGroup(a.g), fmt = a.f || fmtInt1000;
  const cur = done ? a.levels[done - 1] : null;
  const left = next ? Math.max(0, next[0] - val) : 0;
  const leftTxt = next ? `noch ${a.f ? fmtNum(Math.ceil(left * 10) / 10, 1) : fmtInt1000(Math.ceil(left))} ${Math.ceil(left) === 1 && !a.f ? a.u[0] : a.u[1]}` : '';
  const pct100 = Math.round(Math.min(1, Math.max(0, x.ratio)) * 100);
  const state = done === total ? 'Alle Stufen erreicht' : (done ? `Stufe ${done} von ${total}` : 'Noch nicht freigeschaltet');
  return html`<details class="ach ${done ? 'on' : 'off'} ${done === total ? 'full' : ''}" style="--c:${g.color}">
    <summary>
      <span class="ach-ic" style="--p:${Math.round(done / total * 100)}">${ic(a.icon)}</span>
      <span class="ach-t"><b>${cur ? cur[1] : a.name}</b><small>${cur ? a.name : state}</small>
        ${next ? html`<span class="ach-p" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct100}" aria-label="Fortschritt bis ${next[1]}"><i style="width:${pct100}%"></i></span><em>${fmt(Math.min(val, next[0]))} von ${fmt(next[0])} · ${leftTxt} bis „${next[1]}“</em>` : html`<em>${state}</em>`}</span>
      ${ic('chevD', 'ach-chev')}
    </summary>
    <ol class="ach-l">${a.levels.map((l, k) => html`<li class="${k < done ? 'on' : ''}"><span class="ach-dot" aria-hidden="true">${k < done ? ic('check') : ''}</span><span><b>${l[1]}</b><small>${achDesc(a, l)}</small></span><span class="sr-only">${k < done ? 'erreicht' : 'offen'}</span></li>`)}</ol>
  </details>`;
}

function statErfolge() {
  const c = achCtx(), states = achState(c), cnt = achCounts(states), nextUp = achNextUp(states);
  const flt = ACH_FILTERS.some(f => f[0] === S.ui.achFilter) ? S.ui.achFilter : 'all';
  const shown = states.filter(x => (flt === 'done' ? x.done > 0 : flt === 'open' ? x.done < x.total : true));
  const pctAll = Math.round(cnt.levels / cnt.total * 100);
  const sample = S.incidents.length || S.shifts.length;
  return html`
    <div class="stack" style="gap:16px">
      ${c.demoOnly ? html`<div class="notice">${ic('info')}<div class="grow"><p class="muted small">Beispieldaten zählen bei den Erfolgen nicht mit. Mit deinem ersten eigenen Einsatz schaltest du das erste Abzeichen frei.</p></div></div>` : ''}
      <section class="card ach-hero">
        <div class="ach-ring" style="--p:${pctAll}" role="img" aria-label="${cnt.levels} von ${cnt.total} Stufen erreicht"><b>${cnt.levels}</b><small>von ${cnt.total}</small></div>
        <div class="grow"><h3>${cnt.levels ? `${plural(cnt.levels, 'Stufe', 'Stufen')} erreicht` : 'Noch nichts freigeschaltet'}</h3><p class="muted small">${cnt.series ? `Du hast in ${cnt.series} von ${ACH.length} Reihen begonnen. ` : `Es gibt ${ACH.length} Reihen mit ${cnt.total} Stufen. `}Gezählt werden nur deine echten Einsätze und Dienste.</p></div>
      </section>
      ${nextUp.length && flt === 'all' ? html`<section class="card"><div class="chart-h"><div><h3>${ic('flame')} Fast geschafft</h3><p class="sub">Diese Abzeichen sind am nächsten</p></div></div><div class="ach-list">${nextUp.map(achRow)}</div></section>` : ''}
      ${recordsCard(c.rec)}
      <div class="filters"><div class="seg" role="radiogroup" aria-label="Abzeichen filtern">${ACH_FILTERS.map(([v, l]) => html`<button type="button" role="radio" aria-checked="${String(flt === v)}" data-act="achFilter" data-v="${v}">${l}</button>`)}</div></div>
      ${ACH_GROUPS.map(g => {
        const list = shown.filter(x => x.a.g === g.k);
        if (!list.length) return '';
        const gc = achCounts(states.filter(x => x.a.g === g.k));
        return html`<section class="st-sec"><div class="st-sec-h"><h2>${g.label}</h2><p>${gc.levels} von ${gc.total} Stufen</p></div><div class="ach-list">${list.map(achRow)}</div></section>`;
      })}
      ${!shown.length ? html`<div class="empty">${ic('trophy')}<h3>${flt === 'done' ? 'Noch nichts freigeschaltet' : 'Alles erreicht'}</h3><p>${flt === 'done' ? (sample ? 'Dokumentiere deinen ersten echten Einsatz oder trage einen Dienst ein.' : 'Dokumentiere deinen ersten Einsatz.') : 'Du hast alle Stufen erreicht.'}</p></div>` : ''}
      <p class="hint">Die Abzeichen sind zur Motivation gedacht und ersetzen keinen Nachweis. Alles wird auf deinem Gerät berechnet.</p>
    </div>`;
}
ACT.achFilter = el => { S.ui.achFilter = el.dataset.v; rerender(); };

/* Änderungen an Listeneinträgen auf bestehende Einsätze übertragen, ohne den Änderungszeitpunkt zu verändern */
async function patchIncidents(fn) {
  let n = 0;
  for (let k = 0; k < S.incidents.length; k++) {
    const copy = deepClone(S.incidents[k]);
    if (fn(copy) === true) {
      const rec = normalizeIncident(copy);
      await DB.put('incidents', rec);
      S.incidents[k] = rec;
      n++;
    }
  }
  if (n) invalidateCaches();
  return n;
}

function unitOpts(cur) { const u = S.lists.units.slice(); if (cur && !u.includes(cur)) u.push(cur); return u.map(x => ({ value: x, label: x })); }
