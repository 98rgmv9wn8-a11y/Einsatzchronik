*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  background: var(--bg); color: var(--text);
  font: 400 16px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
body.modal-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
a { color: var(--blue-ink); }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
::selection { background: var(--blue-bg); }

.fw { --dom: var(--red); --dom-ink: var(--red-ink); --dom-bg: var(--red-bg); }
.rd { --dom: var(--blue); --dom-ink: var(--blue-ink); --dom-bg: var(--blue-bg); }
.dlrg { --dom: var(--yellow); --dom-ink: var(--yellow-ink); --dom-bg: var(--yellow-bg); }
.other { --dom: var(--muted); --dom-ink: var(--text-2); --dom-bg: var(--surface-3); }
.btn.dom { }
.dlrg .btn.dom, .btn.dom.dlrg { color: #0b0b0b; }

/* ---------- Gerüst ---------- */
.shell { min-width: 0; }
.rail { display: none; }
.view { padding-inline: 16px; padding-block: 18px 120px; max-width: 1040px; margin-inline: auto; min-width: 0; outline: none; }
.loading { padding: 80px 16px; text-align: center; color: var(--muted); }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
  background: var(--surface); border-top: 1px solid var(--line-2);
  padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px));
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 54px; padding: 4px 2px; border: 0; background: none; color: var(--muted);
  font: 600 11px/1.1 var(--font-body); letter-spacing: .02em; border-radius: 10px; text-decoration: none;
}
.tab .ic { width: 23px; height: 23px; }
.tab[aria-current="page"] { color: var(--text); }
.tab[aria-current="page"] .ic { stroke-width: 2.2; }
.tab.cta .tab-fab {
  display: grid; place-items: center; width: 46px; height: 46px; margin-top: -14px; border-radius: 15px;
  background: linear-gradient(135deg, var(--red) 34%, var(--blue) 34% 67%, var(--yellow) 67%); color: #fff;
  box-shadow: 0 6px 16px rgba(0, 0, 0, .35); border: 2px solid var(--surface);
}
.tab.cta .tab-fab .ic { width: 24px; height: 24px; stroke-width: 2.6; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
.tab.cta { color: var(--text); }
body.wiz-on .tabbar { display: none; }
body.wiz-on .view { padding-bottom: 130px; }

.brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 18px; }
.mark { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--red) 34%, var(--blue) 34% 67%, var(--yellow) 67%); flex: none; }
.brand-t { font: 600 19px/1 var(--font-head); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
.brand-t b { font-weight: 600; color: var(--muted); }
.rail-nav { display: grid; gap: 4px; }
.rail .tab { flex-direction: row; justify-content: flex-start; gap: 12px; min-height: 46px; padding: 0 12px; font: 500 16px/1 var(--font-body); letter-spacing: 0; text-align: left; }
.rail .tab[aria-current="page"] { background: var(--surface-2); }
.rail .tab.cta .tab-fab { width: 30px; height: 30px; margin: 0; border-radius: 9px; border: 0; box-shadow: none; }
.rail .tab.cta .tab-fab .ic { width: 18px; height: 18px; }
.rail-foot { margin-top: auto; padding: 12px; color: var(--muted); font-size: 13px; line-height: 1.35; }

@media (min-width: 860px) {
  .shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); align-items: start; }
  .rail { display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; padding: 20px 14px 14px; border-right: 1px solid var(--line); background: var(--bg); }
  .tabbar { display: none; }
  .view { padding-inline: 32px; padding-block: 28px 64px; width: 100%; }
  body.wiz-on .view { padding-bottom: 120px; }
}

/* ---------- Typografie ---------- */
.pg-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.pg-h h1 { font: 600 clamp(30px, 6vw, 40px)/1 var(--font-head); letter-spacing: .035em; text-transform: uppercase; }
.pg-h .sub { color: var(--muted); font-size: 15px; margin-top: 6px; }
.pg-h .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.sec { margin-top: 28px; display: grid; gap: 12px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-h h2 { font: 600 22px/1.1 var(--font-head); letter-spacing: .05em; text-transform: uppercase; }
.sec-h .more { font-size: 14px; }
.eyebrow { font: 600 12px/1.2 var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tabnum { font-variant-numeric: tabular-nums; }
.stack { display: grid; gap: 12px; }
.flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.right { margin-left: auto; }

/* ---------- Schaltflächen ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px;
  border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text);
  font-weight: 600; line-height: 1.1; text-decoration: none; text-align: center; transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.btn.primary:hover { filter: brightness(.94); }
.btn.dom { background: var(--dom, var(--primary)); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.danger { color: var(--crit-ink); border-color: var(--line-2); background: transparent; }
.btn.danger-fill { background: var(--crit); color: #fff; border-color: transparent; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.icon { width: 44px; padding: 0; }
.btn.icon.sm { width: 36px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn .ic { width: 1.2em; height: 1.2em; }

/* ---------- Formulare ---------- */
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .lbl, .lbl { font-weight: 600; font-size: 14px; color: var(--text-2); }
input[type="text"], input[type="search"], input[type="date"], input[type="time"], input[type="password"], input[type="number"], select, textarea {
  width: 100%; min-width: 0; min-height: 46px; padding: 10px 12px; border-radius: 11px;
  border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text); font-size: 16px; line-height: 1.3;
}
textarea { resize: vertical; min-height: 92px; line-height: 1.45; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
select { appearance: none; -webkit-appearance: none; padding-right: 34px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
input[type="date"], input[type="time"] { min-width: 0; }
.hint { color: var(--muted); font-size: 13px; line-height: 1.35; }
.err { color: var(--crit-ink); font-size: 14px; margin-top: 8px; }
.form-grid { display: grid; gap: 14px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--blue); flex: none; }

.seg { display: inline-flex; max-width: 100%; border: 1px solid var(--line-2); border-radius: 12px; background: var(--surface-2); padding: 3px; gap: 3px; flex-wrap: wrap; }
.seg button { min-height: 38px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent; color: var(--text-2); font-weight: 600; font-size: 15px; }
.seg button[aria-checked="true"], .seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.seg.fill { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; width: 100%; }

.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw span { display: block; width: 34px; height: 34px; border-radius: 50%; background: var(--c); border: 2px solid transparent; box-shadow: inset 0 0 0 2px var(--surface); }
.sw input:checked + span { border-color: var(--text); }
.sw input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.sw-amber { --c: var(--tag-amber); } .sw-green { --c: var(--tag-green); } .sw-teal { --c: var(--tag-teal); }
.sw-violet { --c: var(--tag-violet); } .sw-pink { --c: var(--tag-pink); } .sw-gray { --c: var(--tag-gray); }

/* ---------- Chips und Badges ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; min-height: 42px; padding: 0 14px; border-radius: 11px;
  border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text-2); font-weight: 500; font-size: 15px; line-height: 1.15; text-align: left;
}
.chip:hover { background: var(--surface-3); }
.chip[aria-pressed="true"] { background: var(--dom-bg, var(--surface-3)); border-color: var(--dom, var(--text-2)); color: var(--text); font-weight: 600; }
.chip .ck { display: none; width: 1em; height: 1em; }
.chip[aria-pressed="true"] .ck { display: block; }
.chip small { color: var(--muted); font-size: 12px; font-weight: 500; }
.chip.add { border-style: dashed; color: var(--text-2); background: transparent; }
.chip.sm { min-height: 34px; padding: 0 11px; font-size: 14px; }
.cdot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .6); flex: none; }
.xbox { display: grid; gap: 14px; padding-top: 2px; }
.xgroup { display: grid; gap: 6px; }
.xlabel { font-size: 14px; font-weight: 600; color: var(--text-2); }
.xhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.xhead .btn.icon { margin: -6px -4px -6px 0; }
.xsub { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.inwrap { position: relative; display: flex; align-items: center; }
.inwrap input { width: 100%; padding-right: 52px; }
.inwrap .unit { position: absolute; right: 13px; color: var(--muted); font-size: 14px; pointer-events: none; }
.chip.big { min-height: 64px; padding: 0 18px; font-size: 17px; width: 100%; justify-content: flex-start; }

.badge { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; font: 600 12px/1 var(--font-body); letter-spacing: .05em; text-transform: uppercase; background: var(--surface-3); color: var(--text-2); white-space: nowrap; }
.badge .ic { width: 13px; height: 13px; }
.badge.dom { background: var(--dom-bg); color: var(--dom-ink); }
.badge.crit { background: rgba(208, 59, 59, .18); color: var(--crit-ink); }
.badge.crit.potential { background: rgba(250, 178, 25, .16); color: var(--warn-ink); }
.badge.crit.critical { background: rgba(236, 131, 90, .2); color: var(--serious-ink); }
.badge.crit.severe { background: var(--crit); color: #fff; }
.badge.demo { background: transparent; border: 1px dashed var(--line-2); color: var(--muted); }
.tagp { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--surface-3); font-size: 13px; font-weight: 500; color: var(--text-2); white-space: nowrap; }
.tagp::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--tag-gray)); }
.tagp.amber { --c: var(--tag-amber); } .tagp.green { --c: var(--tag-green); } .tagp.teal { --c: var(--tag-teal); }
.tagp.violet { --c: var(--tag-violet); } .tagp.pink { --c: var(--tag-pink); } .tagp.gray { --c: var(--tag-gray); }
.tagp.kw::before { display: none; }
.tagp.kw { background: transparent; border: 1px solid var(--line-2); }
.tagp button { all: unset; display: inline-grid; place-items: center; width: 18px; height: 18px; cursor: pointer; border-radius: 50%; margin-right: -4px; color: var(--muted); }
.tagp button:hover { color: var(--text); }

/* ---------- Karten, Kacheln ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.card.flat { background: transparent; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-h h3 { font: 600 19px/1.1 var(--font-head); letter-spacing: .05em; text-transform: uppercase; }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line-2); }
.notice .ic { margin-top: 2px; color: var(--blue-ink); }
.notice.warn .ic { color: var(--warn-ink); }
.notice .grow > p + p { margin-top: 4px; }
.notice .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

.hero { display: grid; gap: 16px; padding: 20px; }
.hero-n { font: 600 clamp(54px, 14vw, 76px)/.95 var(--font-body); letter-spacing: -.02em; }
.hero-l { color: var(--text-2); font-size: 15px; margin-top: 6px; }
.split { display: flex; height: 10px; gap: 2px; margin-top: 10px; }
.split i { display: block; min-width: 6px; border-radius: 5px; }
.split i.fw { background: var(--red); } .split i.rd { background: var(--blue); } .split i.dlrg { background: var(--yellow); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 14px; height: 4px; border-radius: 2px; background: var(--c); display: inline-block; }
.legend i.sq { height: 12px; width: 12px; border-radius: 3px; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
.tile-l { font-size: 14px; color: var(--text-2); }
.tile-v { font: 600 34px/1.05 var(--font-body); letter-spacing: -.01em; margin-top: 6px; }
.tile-v small { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.tile-d { font-size: 13px; color: var(--muted); margin-top: 4px; }
@media (min-width: 700px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.quick-b { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-height: 108px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--dom-bg); color: var(--text); text-align: left; }
.quick-b .ic { width: 28px; height: 28px; color: var(--dom-ink); }
.quick-b div { display: grid; gap: 4px; min-width: 0; }
.quick-b strong { font: 600 22px/1 var(--font-head); letter-spacing: .04em; text-transform: uppercase; overflow-wrap: anywhere; }
.quick-b span { color: var(--text-2); font-size: 14px; line-height: 1.25; }
.quick-b:hover { border-color: var(--dom); }
@media (max-width: 759px) {
  .quick { grid-template-columns: 1fr; gap: 10px; }
  .quick-b { flex-direction: row; align-items: center; min-height: 64px; gap: 14px; padding-block: 10px; }
}
.gear-b { margin-left: auto; }
@media (min-width: 860px) { .gear-b { display: none; } }

.two { display: grid; gap: 16px; }
@media (min-width: 860px) { .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

/* ---------- Einsatzliste ---------- */
.mon { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin: 20px -16px 8px; padding: 8px 16px; background: var(--bg); font: 600 15px/1.2 var(--font-head); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
@media (min-width: 860px) { .mon { margin-inline: -32px; padding-inline: 32px; } }
.list { display: grid; gap: 10px; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; width: 100%; padding: 14px 14px 14px 16px; text-align: left;
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text);
}
.row:hover { border-color: var(--line-2); background: var(--surface-2); }
.row-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.row-date { font-weight: 600; color: var(--text-2); font-variant-numeric: tabular-nums; }
.row-title { margin-top: 6px; font-size: 16px; line-height: 1.35; font-weight: 500; overflow-wrap: anywhere; }
.row-meta { margin-top: 4px; font-size: 14px; color: var(--text-2); }
.row-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.row-ind { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; color: var(--muted); font-size: 13px; }
.row-ind span { display: inline-flex; align-items: center; gap: 4px; }
.row-ind .fav { color: var(--warn-ink); }
.row-ind .fav .ic { fill: currentColor; }
.empty { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 40px 16px; color: var(--text-2); }
.empty .ic { width: 38px; height: 38px; color: var(--muted); }
.empty h3 { font: 600 22px/1.1 var(--font-head); letter-spacing: .05em; text-transform: uppercase; color: var(--text); }

.searchbar { display: flex; gap: 8px; align-items: stretch; }
.searchbar .sb { position: relative; flex: 1 1 auto; min-width: 0; }
.searchbar .sb .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.searchbar input { padding-left: 42px; }
.btn .count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--blue); color: #fff; font-size: 12px; }
.fpanel { display: grid; gap: 14px; margin-top: 12px; }
.fgrid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 860px) { .fgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.fgrid .wide { grid-column: 1 / -1; }
.active-f { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.resultline { margin-top: 14px; color: var(--muted); font-size: 14px; }

/* ---------- Detailseite ---------- */
.dhead { display: grid; gap: 12px; }
.dtop { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dtitle { font: 600 clamp(26px, 5.4vw, 34px)/1.12 var(--font-head); letter-spacing: .02em; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.fact dt { font: 600 12px/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.fact dd { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
@media (min-width: 700px) { .facts { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.prose { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
.dsec { display: grid; gap: 8px; }
.dsec h3 { font: 600 14px/1.2 var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.plist { display: grid; gap: 8px; }
.pitem { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 10px 12px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); }
.pitem b { font-weight: 600; }
.pitem .meta { color: var(--muted); font-size: 14px; }
.pitem .note { flex-basis: 100%; color: var(--text-2); font-size: 14px; }
.pitem .pdetail { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
.dchip { display: inline-flex; align-items: center; min-height: 24px; padding: 2px 9px; border-radius: 8px; background: var(--surface-3); color: var(--text); font-size: 13px; font-weight: 500; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; max-width: 100%; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th { text-align: left; font: 600 12px/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line-2); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl abbr { text-decoration: none; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr.sum td { font-weight: 600; background: var(--surface-2); }
@media (max-width: 599px) {
  .tbl th, .tbl td { padding-left: 8px; padding-right: 8px; }
  .tbl th { white-space: normal; letter-spacing: .04em; font-size: 11px; }
  .tbl td { font-size: 14px; overflow-wrap: anywhere; }
  .tbl.dz, .tbl.dz tbody { display: block; }
  .tbl.dz thead { display: none; }
  .tbl.dz tr { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "n t d" "e e w" "o o o"; gap: 6px 12px; align-items: baseline; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .tbl.dz tr:last-child { border-bottom: 0; }
  .tbl.dz td { padding: 0; border: 0; background: none; }
  .tbl.dz .c-n { grid-area: n; font-weight: 600; }
  .tbl.dz tr:not(.sum) .c-n::before { content: "Gabe "; }
  .tbl.dz .c-t { grid-area: t; color: var(--muted); }
  .tbl.dz .c-d { grid-area: d; font-weight: 600; white-space: nowrap; text-align: right; }
  .tbl.dz .c-w { grid-area: w; color: var(--muted); }
  .tbl.dz .c-e { grid-area: e; }
  .tbl.dz .c-o { grid-area: o; color: var(--text-2); }
  .tbl.dz .c-o:empty { display: none; }
  .tbl.dz tr.sum { grid-template-columns: 1fr auto; grid-template-areas: "n d"; background: var(--surface-2); }
  .tbl.dz tr.sum td { background: none; }
  .tbl.dz .c-x { display: none; }
}
.eff { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; }
.eff .ic { width: 16px; height: 16px; }
.eff.desired { color: var(--good-ink); } .eff.partial { color: var(--warn-ink); } .eff.none { color: var(--text-2); }
.eff.adverse { color: var(--crit-ink); } .eff.unrated { color: var(--muted); }
.medcard { display: grid; gap: 10px; }
.medcard h4 { font: 600 18px/1.2 var(--font-body); }
.photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 700px) { .photos { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.photo { position: relative; display: block; width: 100%; aspect-ratio: 1; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .2s; }
.photo img.loaded { opacity: 1; }
.dots { display: inline-flex; gap: 5px; vertical-align: middle; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--surface-3); border: 1px solid var(--line-2); }
.dots i.on { background: var(--text-2); border-color: var(--text-2); }
.dots.dom i.on { background: var(--dom); border-color: var(--dom); }
.rating { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ---------- Assistent ---------- */
.wiz-top { display: flex; align-items: center; gap: 10px; justify-content: space-between; margin-bottom: 10px; }
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; list-style: none; padding: 0; margin: 0 0 6px; }
.steps button { display: block; width: 100%; height: 34px; padding: 0; border: 0; background: none; position: relative; }
.steps button::before { content: ''; position: absolute; left: 0; right: 0; top: 14px; height: 6px; border-radius: 3px; background: var(--surface-3); }
.steps .done button::before { background: var(--dom, var(--text-2)); opacity: .55; }
.steps .cur button::before { background: var(--dom, var(--text)); }
.steps .cur button { }
.stepcap { display: flex; align-items: baseline; gap: 10px; margin-bottom: 18px; }
.stepcap .n { white-space: nowrap; font: 600 14px/1 var(--font-body); letter-spacing: .09em; color: var(--muted); text-transform: uppercase; }
.stepcap h1 { font: 600 clamp(28px, 6vw, 36px)/1.05 var(--font-head); letter-spacing: .03em; text-transform: uppercase; }
.wiz-body { display: grid; gap: 22px; }
.group { display: grid; gap: 10px; }
.group > h3, .group > .lbl-h { font: 600 13px/1.2 var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.bigpick { display: grid; gap: 12px; }
@media (min-width: 560px) { .bigpick { grid-template-columns: 1fr 1fr; } }
.dompick { display: flex; align-items: center; gap: 14px; min-height: 92px; padding: 14px 18px; border-radius: 16px; border: 1px solid var(--line-2); background: var(--surface); text-align: left; width: 100%; }
.dompick .ic { width: 34px; height: 34px; color: var(--dom-ink); }
.dompick strong { display: block; font: 600 26px/1 var(--font-head); letter-spacing: .05em; text-transform: uppercase; }
.dompick span { color: var(--text-2); font-size: 14px; }
.dompick[aria-pressed="true"] { background: var(--dom-bg); border-color: var(--dom); }

/* ---------- Diagramme ---------- */
.chart { display: grid; gap: 14px; }

.hb-l { font-size: 14px; line-height: 1.2; color: var(--text-2); overflow-wrap: anywhere; }
.hb-t { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hb-b { display: block; height: 18px; width: calc(var(--w, 0) * 84%); min-width: 3px; border-radius: 0 4px 4px 0; background: var(--series, var(--blue)); transition: filter .12s; }

.cols { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; }

.cols-plot::before { top: 0; } .cols-plot::after { top: 50%; }

.colb { width: min(100%, 24px); height: calc(var(--p, 0) * 1%); display: flex; flex-direction: column-reverse; gap: 2px; }

.colb i.ord { background: var(--c); }

.stackbar i.rosc { --c: var(--good); } .stackbar i.norosc { --c: #8a95aa; } .stackbar i.open { --c: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line-2); }
.stackbar i.adverse { --c: var(--crit); } .stackbar i.unrated { --c: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line-2); }

/* ---------- Dialoge ---------- */

.lb-load { color: #fff; }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

#toast-root { position: fixed; left: 0; right: 0; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 80; display: grid; justify-items: center; gap: 8px; padding: 0 16px; pointer-events: none; }

@media (prefers-reduced-motion: reduce) {

}

  .hb-b, .colb i, .stackbar i, .split i { forced-color-adjust: none; outline: 1px solid CanvasText; }
}

/* ---- 10-shifts.css ---- */
/* ---------- Dienstkalender ---------- */
.cal { padding: 14px; }

.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }

.cal-bars i.fw { --c: var(--red); } .cal-bars i.rd { --c: var(--blue); } .cal-bars i.dlrg { --c: var(--yellow); } .cal-bars i.other { --c: var(--muted); }
.cal-bars i.cont { border-radius: 0; opacity: .7; }

/* Art des Dienstes: voll = Hauptberuf, Streifen = Ehrenamt, Punkte = Nebenjob */
.cal-bars i.m-volunteer, .lsw.m-volunteer { background: repeating-linear-gradient(135deg, var(--c) 0 3px, transparent 3px 5px); box-shadow: inset 0 0 0 1px var(--c); }
.cal-bars i.m-side, .lsw.m-side { background: radial-gradient(circle, var(--c) 1.1px, transparent 1.4px) 0 0 / 4px 4px; box-shadow: inset 0 0 0 1px var(--c); }
.cal-leg { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 13px; color: var(--text-2); }
.cal-leg span { display: inline-flex; align-items: center; gap: 6px; }
.lsw { display: inline-block; width: 18px; height: 8px; border-radius: 3px; background: var(--c, var(--muted)); }
.lsw.fw { --c: var(--red); } .lsw.rd { --c: var(--blue); } .lsw.dlrg { --c: var(--yellow); } .lsw.other { --c: var(--muted); }
.cal-e-k { display: inline-grid; place-items: center; min-width: 16px; height: 16px; border-radius: 8px; background: var(--text); color: var(--bg); font: 700 11px/1 var(--font-body); padding: 0 4px; }

.shiftrow { display: flex; gap: 12px; align-items: flex-start; padding: 12px 12px 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--dom, var(--muted)); }

.dtime3 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }

.chip.fw, .chip.rd, .chip.dlrg, .chip.other { --dom-bg: var(--surface-3); }

.chip.fw { --dom: var(--red); --dom-bg: var(--red-bg); } .chip.rd { --dom: var(--blue); --dom-bg: var(--blue-bg); } .chip.dlrg { --dom: var(--yellow); --dom-bg: var(--yellow-bg); }

.cal-d { align-items: stretch; }
.cal-n { text-align: left; padding-left: 7px; }
.cal-bars { padding-inline: 5px; }

/* ---- 15-misc.css ---- */
/* ---------- Ergänzungen: Dashboard, Auswertung, Kilometer ---------- */

.dienst { display: grid; gap: 8px; border-left: 4px solid var(--dom, var(--line-2)); }

function endInfo(d) {
  const none = { ts: 0, min: 0, endDate: '', err: '' };
  if (!validTime(d.endTime)) return none;
  const st = toTs(d.date, d.time);
  let ed = validDate(d.endDate) ? d.endDate : d.date;
  let ts = toTs(ed, d.endTime);
  if (!validDate(d.endDate) && ts <= st) { ed = addDays(d.date, 1); ts = toTs(ed, d.endTime); }
  if (ts <= st) return { ts: 0, min: 0, endDate: '', err: 'Das Ende liegt vor dem Beginn.' };
  const min = Math.round((ts - st) / 60000);
  if (min > 14 * 1440) return { ts: 0, min: 0, endDate: '', err: 'Ein Einsatz über mehr als 14 Tage ist nicht vorgesehen.' };
  return { ts, min, endDate: ed, err: '' };
}

/* Ältere Daten: „Kardioversion / Defibrillation“ ist jetzt „Kardioversion“, die Defibrillation gehört zur Reanimation */
const LEGACY_SHOCK = { id: `d-p-${slug('Kardioversion / Defibrillation')}`, name: 'Kardioversion / Defibrillation' };
const NEW_SHOCK = { id: `d-p-${slug('Kardioversion')}`, name: 'Kardioversion' };
function upgradeListProc(p) {
  if (p && p.id === LEGACY_SHOCK.id && p.name === LEGACY_SHOCK.name) { p.id = NEW_SHOCK.id; p.name = NEW_SHOCK.name; p.special = 'shock'; }
  return p;
}
function upgradeProcedures(list) {
  const out = [];
  let defib = null;
  list.forEach(p0 => {
    let p = p0;
    if (p && typeof p === 'object' && (p.refId === LEGACY_SHOCK.id || (p.special === 'shock' && p.name === LEGACY_SHOCK.name))) {
      if (p.shock && p.shock.type === 'defib') { defib = { role: p.role, note: p.note, energy: p.shock.energy, count: p.shock.count }; return; }
      p = Object.assign({}, p, { refId: NEW_SHOCK.id, name: NEW_SHOCK.name, special: 'shock' });
    }
    out.push(p);
  });
  if (defib) {
    let c = out.find(p => p && p.special === 'cpr');
    if (!c) {
      c = { id: uid(), refId: `d-p-${slug('CPR / Reanimation')}`, name: 'CPR / Reanimation', category: 'Reanimation und Rhythmus', role: defib.role || 'self', note: '', special: 'cpr' };
      out.push(c);
    }
    c.cpr = Object.assign({}, c.cpr || {});
    if (c.cpr.energy === '' || c.cpr.energy == null) c.cpr.energy = defib.energy;
    if (c.cpr.count === '' || c.cpr.count == null) c.cpr.count = defib.count;
    if (defib.note && !c.note) c.note = defib.note;
  }
  return out;
}

/* Deterministische IDs für Standardeinträge: Backups mehrerer Geräte lassen sich so ohne Dubletten zusammenführen. */
function buildDefaultLists() {
  const L = {
    vehicles: [], functions: [], rdTypes: [], fwOtherTypes: [], dlrgTypes: [], procedures: [], activities: [],
    medications: [], tags: [], places: [], units: DEF_UNITS.slice(), routes: DEF_ROUTES.slice(),
  };
  for (const d of ['rd', 'fw', 'dlrg']) {
    DEF_VEHICLES[d].forEach(t => L.vehicles.push({ id: `d-v-${d}-${slug(t)}`, domain: d, type: t, callsign: '', favorite: false }));
    DEF_FUNCS[d].forEach(n => L.functions.push({ id: `d-f-${d}-${slug(n)}`, domain: d, name: n }));
  }
  DEF_RD_TYPES.forEach(n => L.rdTypes.push({ id: `d-rt-${slug(n)}`, name: n }));
  DEF_FW_OTHER.forEach(n => L.fwOtherTypes.push({ id: `d-ot-${slug(n)}`, name: n }));
  DEF_DLRG_TYPES.forEach(([g, n]) => L.dlrgTypes.push({ id: `d-dt-${g}-${slug(n)}`, group: g, name: n }));
  DEF_PROCS.forEach(([n, c, sp]) => L.procedures.push({ id: `d-p-${slug(n)}`, name: n, category: c, special: sp || '' }));
  for (const g of Object.keys(DEF_ACTS)) DEF_ACTS[g].forEach(n => L.activities.push({ id: `d-a-${g}-${slug(n)}`, group: g, name: n }));
  DEF_MEDS.forEach(([n, aka, unit, route]) => L.medications.push({ id: `d-m-${slug(n)}`, name: n, aka: aka || '', unit: unit || 'mg', route: route || '' }));
  DEF_TAGS.forEach(([n, c]) => L.tags.push({ id: `d-t-${slug(n)}`, name: n, color: c }));
  return L;
}

/* ---------- IndexedDB ---------- */
const IDB_TIMEOUT = 3000;
const IDBW = {
  db: null,
  open() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('IndexedDB nicht verfügbar'));
      let req, done = false;
      const fin = (ok, v) => { if (done) return; done = true; clearTimeout(tm); ok ? resolve(v) : reject(v); };
      const tm = setTimeout(() => fin(false, new Error('IndexedDB antwortet nicht')), IDB_TIMEOUT);
      try { req = indexedDB.open('einsatzchronik', 1); } catch (e) { return fin(false, e); }
      req.onupgradeneeded = () => {
        const d = req.result;
        for (const n of ['incidents', 'photos', 'thumbs']) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: 'id' });
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      };
      req.onsuccess = () => {
        if (done) { try { req.result.close(); } catch (e) { /* ignore */ } return; }
        this.db = req.result;
        this.db.onversionchange = () => { try { this.db.close(); } catch (e) { /* ignore */ } this.db = null; };
        this.db.onclose = () => { this.db = null; };
        fin(true);
      };
      req.onerror = () => fin(false, req.error || new Error('IndexedDB-Fehler'));
      req.onblocked = () => fin(false, new Error('IndexedDB blockiert'));
    });
  },
  once(store, mode, fn) {
    return new Promise((resolve, reject) => {
      let t, r;
      try { t = this.db.transaction(store, mode); r = fn(t.objectStore(store)); } catch (e) { reject(e); return; }
      t.oncomplete = () => resolve(r ? r.result : undefined);
      t.onerror = () => reject(t.error || new Error('Speicherfehler'));
      t.onabort = () => reject(t.error || new Error('Speichervorgang abgebrochen'));
    });
  },
  // iOS trennt die Verbindung zur Datenbank gelegentlich, wenn die App im Hintergrund war. Dann einmal neu öffnen.
  async run(store, mode, fn) {
    try { return await this.once(store, mode, fn); }
    catch (e) {
      try { if (this.db) this.db.close(); } catch (x) { /* ignore */ }
      this.db = null;
      try { await this.open(); } catch (x) { throw e; }
      return this.once(store, mode, fn);
    }
  },
};

const DB = {
  mode: 'idb',
  mem: { incidents: new Map(), photos: new Map(), thumbs: new Map(), kv: new Map() },
  async init() {
    let last = null;
    for (let a = 0; a < 3; a++) {
      try {
        await IDBW.open();
        await IDBW.run('kv', 'readonly', st => st.get('settings'));   // Lesetest
        this.mode = 'idb'; S.persistent = true; S.storage.mode = 'idb'; S.storage.attempts = a + 1; S.storage.error = '';
        return;
      } catch (e) {
        last = e;
        try { if (IDBW.db) IDBW.db.close(); } catch (x) { /* ignore */ }
        IDBW.db = null;
        if (a < 2) await sleep(300 * (a + 1));
      }
    }
    console.warn('IndexedDB nicht verfügbar, Arbeitsspeicher wird genutzt', last);
    this.mode = 'mem'; S.persistent = false; S.storage.mode = 'mem'; S.storage.attempts = 3;
    S.storage.error = String((last && (last.name ? last.name + ': ' : '') + (last.message || last)) || 'unbekannt').slice(0, 160);
  },
  get(store, key) { return this.mode === 'idb' ? IDBW.run(store, 'readonly', s => s.get(key)) : Promise.resolve(this.mem[store].get(key)); },
  getAll(store) { return this.mode === 'idb' ? IDBW.run(store, 'readonly', s => s.getAll()) : Promise.resolve(Array.from(this.mem[store].values())); },
  keys(store) { return this.mode === 'idb' ? IDBW.run(store, 'readonly', s => s.getAllKeys()) : Promise.resolve(Array.from(this.mem[store].keys())); },
  put(store, val, key) {
    if (store === 'incidents' || store === 'kv') mirrorSoon();
    if (this.mode === 'idb') return IDBW.run(store, 'readwrite', s => (key === undefined ? s.put(val) : s.put(val, key)));
    this.mem[store].set(key === undefined ? val.id : key, val);
    return Promise.resolve();
  },
  del(store, key) {
    if (store === 'incidents' || store === 'kv') mirrorSoon();
    if (this.mode === 'idb') return IDBW.run(store, 'readwrite', s => s.delete(key));
    this.mem[store].delete(key);
    return Promise.resolve();
  },
  clear(store) {
    if (store === 'incidents' || store === 'kv') mirrorSoon();
    if (this.mode === 'idb') return IDBW.run(store, 'readwrite', s => s.clear());
    this.mem[store].clear();
    return Promise.resolve();
  },
};

/* Neue Standardeinträge in bestehende Listen übernehmen (einmalig je Listenversion). Gleichnamige eigene Einträge bleiben erhalten. */
function migrateDefaults(L) {
  const def = buildDefaultLists();
  for (const k of ['procedures', 'medications']) {
    def[k].forEach(d => {
      if (L[k].some(x => x.id === d.id)) return;
      const same = L[k].find(x => norm(x.name) === norm(d.name));
      if (same) {
        if (k === 'procedures') {
          if ((same.category || 'Sonstiges') === 'Sonstiges' && d.category !== 'Sonstiges') same.category = d.category;
          if (!PROC_SPECIALS.includes(same.special) && d.special) same.special = d.special;
        }
        return;
      }
      L[k].push(d);
    });
  }
  /* Bereich DLRG: Fahrzeuge, Funktionen, Tätigkeiten und Einsatzszenarien einmalig ergänzen (nur neue DLRG-Einträge) */
  def.vehicles.filter(d => d.domain === 'dlrg').forEach(d => { if (!L.vehicles.some(x => x.id === d.id)) L.vehicles.push(d); });
  def.functions.filter(d => d.domain === 'dlrg').forEach(d => { if (!L.functions.some(x => x.id === d.id)) L.functions.push(d); });
  def.activities.filter(d => DLRG_GROUPS.some(g => g.k === d.group)).forEach(d => { if (!L.activities.some(x => x.id === d.id)) L.activities.push(d); });
  def.dlrgTypes.forEach(d => { if (!L.dlrgTypes.some(x => x.id === d.id)) L.dlrgTypes.push(d); });
  /* neue Suchbegriffe bei Standard-Medikamenten ergänzen */
  def.medications.forEach(d => {
    const e = L.medications.find(x => x.id === d.id);
    if (!e || !d.aka) return;
    const have = norm(e.aka || '');
    const add = d.aka.split(',').map(t => t.trim()).filter(t => t && !have.includes(norm(t)));
    if (add.length) e.aka = [e.aka, ...add].filter(Boolean).join(', ');
  });
}

/* ---------- Kryptografie: App-Sperre und verschlüsselte Backups ---------- */

  async verifyPin(pin) {

    if (h.length !== L.hash.length) return false;
    let diff = 0;
    for (let i = 0; i < h.length; i++) diff |= h.charCodeAt(i) ^ L.hash.charCodeAt(i);
    return diff === 0;
  },
  async encryptText(text, password) {
    const salt = this.rand(16), iv = this.rand(12), iter = 250000;
    const km = await this.keyMaterial(password);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text)));
    return { app: APP_ID, enc: true, v: 1, kdf: 'PBKDF2-SHA256', iter, salt: b64enc(salt), iv: b64enc(iv), data: b64enc(ct) };
  },
  async decryptText(c, password) {
    const km = await this.keyMaterial(password);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64dec(c.salt), iterations: c.iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64dec(c.iv) }, key, b64dec(c.data));
    return new TextDecoder().decode(pt);
  },
};

/* ==========================================================================
   Einsatzchronik – UI-Bausteine: Dialoge, Formulare, Toasts, Tooltips, Lightbox
   (alert/confirm/prompt stehen im Viewer nicht zur Verfügung, daher eigene Dialoge)
   ========================================================================== */

const BIND = {};   // Registry für data-bind="scope:pfad"

const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
const focusables = root => $$(FOCUSABLE, root).filter(el => el.offsetParent !== null || el === document.activeElement);

/* ---------- Overlay-Verwaltung ---------- */
const OV = { stack: [] };

function openOverlay(content, opts = {}) {
  const prev = document.activeElement;
  const el = document.createElement('div');
  el.className = 'ov' + (opts.sheet ? ' ov-sheet' : '');
  el.innerHTML = `<div class="dlg ${esc(opts.cls || '')}" role="dialog" aria-modal="true" aria-label="${esc(opts.label || 'Dialog')}" tabindex="-1">${content.s}</div>`;
  const dlg = el.firstElementChild;
  const h = {
    el, dlg, closed: false, dismissable: opts.dismissable !== false,
    close(result) {
      if (h.closed) return;
      h.closed = true;
      const i = OV.stack.indexOf(h);
      if (i >= 0) OV.stack.splice(i, 1);
      el.classList.add('out');
      setTimeout(() => el.remove(), 140);
      document.body.classList.toggle('modal-open', OV.stack.length > 0);
      try { if (prev && prev !== document.body && document.contains(prev) && opts.restoreFocus !== false) prev.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
      if (opts.onClose) opts.onClose(result);
    },
    focus(sel) {
      const t = sel ? dlg.querySelector(sel) : null;
      const f = t || focusables(dlg)[0] || dlg;
      try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    },
  };
  el.addEventListener('pointerdown', e => { if (e.target === el && h.dismissable) h.close(undefined); });
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-dlg]');
    if (!b || !el.contains(b) || b.disabled) return;
    if (opts.onAction) opts.onAction(b.dataset.dlg, h, b); else h.close(b.dataset.dlg);
  });
  $('#overlay-root').appendChild(el);
  OV.stack.push(h);
  document.body.classList.add('modal-open');
  if (opts.onMount) opts.onMount(h);
  requestAnimationFrame(() => { if (!h.closed) h.focus(opts.focus); });
  return h;
}

document.addEventListener('keydown', e => {
  const top = OV.stack[OV.stack.length - 1];
  if (!top) return;
  if (e.key === 'Escape' && top.dismissable) { e.preventDefault(); top.close(undefined); return; }
  if (e.key === 'Tab') {
    const f = focusables(top.dlg);
    if (!f.length) { e.preventDefault(); top.dlg.focus(); return; }
    const first = f[0], last = f[f.length - 1], act = document.activeElement;
    const inside = top.dlg.contains(act);
    if (e.shiftKey && (act === first || !inside)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (act === last || !inside)) { e.preventDefault(); first.focus(); }
  }
});

const dlgHtml = ({ title, body = '', actions = '', closeBtn = false }) => html`
  <header class="dlg-h"><h2 class="dlg-t">${title}</h2>${closeBtn ? html`<button type="button" class="btn icon ghost" data-dlg="cancel" aria-label="Schließen">${ic('x')}</button>` : ''}</header>
  <div class="dlg-b">${body}</div>
  ${actions ? html`<footer class="dlg-f">${actions}</footer>` : ''}`;

function confirmBox({ title, text, ok = 'OK', cancel = 'Abbrechen', danger = false, body = '' }) {
  return new Promise(resolve => {
    openOverlay(dlgHtml({
      title,
      body: html`<p class="dlg-p">${text}</p>${body}`,
      actions: html`<button type="button" class="btn" data-dlg="cancel">${cancel}</button><button type="button" class="btn ${danger ? 'danger-fill' : 'primary'}" data-dlg="ok">${ok}</button>`,
    }), { label: title, focus: danger ? '[data-dlg="cancel"]' : '[data-dlg="ok"]', onClose: r => resolve(r === 'ok') });
  });
}

function alertBox({ title, text, ok = 'Verstanden', body = '', dismissable = true }) {
  return new Promise(resolve => {
    openOverlay(dlgHtml({
      title,
      body: html`<p class="dlg-p">${text}</p>${body}`,
      actions: html`<button type="button" class="btn primary" data-dlg="ok">${ok}</button>`,
    }), { label: title, focus: '[data-dlg="ok"]', dismissable, onClose: () => resolve() });
  });
}

/* Auswahl mit mehreren Schaltflächen; liefert den Wert der gewählten Schaltfläche oder null */
function choiceBox({ title, text, choices, body = '' }) {

    }), { label: title, focus: `[data-dlg="${choices[0].v}"]`, onClose: r => resolve(r && r !== 'cancel' ? r : null) });

/* ---------- Formular-Dialog ---------- */
function fieldHtml(f, idp) {
  const id = `${idp}-${f.key}`;
  const hint = f.hint ? html`<small class="hint">${f.hint}</small>` : '';
  switch (f.type) {
    case 'select':
      return html`<div class="field"><label for="${id}">${f.label}</label><select id="${id}" name="${f.key}">${f.options.map(o => html`<option value="${o.value}" ${o.value === f.value ? 'selected' : ''}>${o.label}</option>`)}</select>${hint}</div>`;
    case 'seg':
      return html`<div class="field"><span class="lbl">${f.label}</span><div class="seg" role="radiogroup" aria-label="${f.label}">${f.options.map(o => html`<button type="button" role="radio" aria-checked="${String(o.value === f.value)}" data-seg="${f.key}" data-val="${o.value}">${o.label}</button>`)}</div>${hint}</div>`;
    case 'check':
      return html`<label class="check"><input type="checkbox" id="${id}" name="${f.key}" ${f.value ? 'checked' : ''}><span>${f.label}</span></label>`;
    case 'color':
      return html`<div class="field"><span class="lbl">${f.label}</span><div class="swatches" role="radiogroup" aria-label="${f.label}">${TAG_COLORS.map(c => html`<label class="sw sw-${c}" title="${TAG_COLOR_LABEL[c]}"><input type="radio" name="${f.key}" value="${c}" ${c === f.value ? 'checked' : ''}><span></span></label>`)}</div></div>`;
    case 'textarea':
      return html`<div class="field"><label for="${id}">${f.label}</label><textarea id="${id}" name="${f.key}" rows="${f.rows || 3}" placeholder="${f.placeholder || ''}" maxlength="${f.maxlength || 2000}">${f.value || ''}</textarea>${hint}</div>`;
    case 'combo':
      return html`<div class="field"><label for="${id}">${f.label}</label><input type="text" id="${id}" name="${f.key}" list="${id}-dl" value="${f.value || ''}" placeholder="${f.placeholder || ''}" maxlength="${f.maxlength || 80}" autocomplete="off"><datalist id="${id}-dl">${(f.options || []).map(o => html`<option value="${o}"></option>`)}</datalist>${hint}</div>`;
    case 'password':
      return html`<div class="field"><label for="${id}">${f.label}</label><input type="password" id="${id}" name="${f.key}" value="" placeholder="${f.placeholder || ''}" maxlength="${f.maxlength || 128}" autocomplete="off" ${f.mode ? html`inputmode="${f.mode}"` : ''}>${hint}</div>`;
    default:
      return html`<div class="field"><label for="${id}">${f.label}</label><input type="text" id="${id}" name="${f.key}" value="${f.value || ''}" placeholder="${f.placeholder || ''}" maxlength="${f.maxlength || 80}" autocomplete="off" ${f.mode ? html`inputmode="${f.mode}"` : ''}>${hint}</div>`;
  }
}

function formBox({ title, intro = '', fields, submit = 'Speichern', cancel = 'Abbrechen', danger = false, extra = '' }) {
  return new Promise(resolve => {
    const idp = 'f' + uid().slice(0, 5);
    const body = html`${intro ? html`<p class="dlg-p">${intro}</p>` : ''}<div class="form-grid">${fields.map(f => fieldHtml(f, idp))}</div>${extra}<p class="err" data-err role="alert" hidden></p>`;
    const trySubmit = h => {
      const errEl = $('[data-err]', h.dlg);
      const vals = {};
      for (const f of fields) {
        let v;
        const q = sel => h.dlg.querySelector(sel);
        if (f.type === 'check') v = !!q(`[name="${f.key}"]`).checked;
        else if (f.type === 'seg') { const b = q(`[data-seg="${f.key}"][aria-checked="true"]`); v = b ? b.dataset.val : (f.value ?? ''); }
        else if (f.type === 'color') { const r = q(`[name="${f.key}"]:checked`); v = r ? r.value : (f.value || 'gray'); }
        else if (f.type === 'password') v = String(q(`[name="${f.key}"]`).value ?? '');
        else v = String(q(`[name="${f.key}"]`).value ?? '').trim();
        let msg = '';
        if (f.required && v === '') msg = `${f.label} ist erforderlich.`;
        else if (f.validate) msg = f.validate(v) || '';
        if (msg) {
          errEl.textContent = msg; errEl.hidden = false;
          const t = q(`[name="${f.key}"]`) || q(`[data-seg="${f.key}"]`);
          if (t) t.focus();
          return;
        }
        vals[f.key] = v;
      }
      h.close(vals);
    };
    openOverlay(dlgHtml({
      title, body,
      actions: html`<button type="button" class="btn" data-dlg="cancel">${cancel}</button><button type="button" class="btn ${danger ? 'danger-fill' : 'primary'}" data-dlg="ok">${submit}</button>`,
    }), {
      label: title,
      onAction(act, h) { if (act === 'ok') trySubmit(h); else h.close(null); },
      onClose: r => resolve(r && typeof r === 'object' ? r : null),
      onMount(h) {
        h.dlg.addEventListener('click', e => {
          const b = e.target.closest('[data-seg]');
          if (!b) return;
          $$(`[data-seg="${b.dataset.seg}"]`, h.dlg).forEach(x => x.setAttribute('aria-checked', String(x === b)));
        });
        h.dlg.addEventListener('keydown', e => {
          if (e.key === 'Enter' && e.target.tagName === 'INPUT' && (e.target.type === 'text' || e.target.type === 'password')) { e.preventDefault(); trySubmit(h); }
        });
      },
    });
  });
}

const promptText = async ({ title, label, value = '', placeholder = '', submit = 'Hinzufügen', hint = '' }) => {
  const r = await formBox({ title, fields: [{ key: 'v', label, value, placeholder, required: true, hint }], submit });
  return r ? r.v : null;
};

/* ---------- Toasts ---------- */
function toast(msg, opts = {}) {
  const root = $('#toast-root');
  if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="toast-m">${esc(msg)}</span>${opts.action ? `<button type="button" class="toast-a">${esc(opts.action.label)}</button>` : ''}`;
  root.appendChild(el);
  const kill = () => { if (!el.isConnected) return; el.classList.add('out'); setTimeout(() => el.remove(), 180); };
  if (opts.action) $('.toast-a', el).addEventListener('click', () => { kill(); opts.action.fn(); });
  setTimeout(kill, opts.ms || 3800);
  while (root.children.length > 3) root.firstElementChild.remove();
}

/* ---------- Tooltips für Diagramme (Hover, Fokus, Tippen) ---------- */
const tipAttr = (title, rows) => JSON.stringify({ t: title, r: rows });
const Tip = {
  el: null,
  build(spec) {
    const el = this.el;
    el.textContent = '';
    const t = document.createElement('div');
    t.className = 'tip-t';
    t.textContent = spec.t || '';
    el.appendChild(t);
    (spec.r || []).forEach(r => {
      const row = document.createElement('div');
      row.className = 'tip-r';
      const k = document.createElement('span');
      k.className = 'tip-k' + (r.c ? ' ' + r.c : '');
      if (r.s === 'none') k.style.visibility = 'hidden'; else if (r.s) k.style.background = r.s;
      const v = document.createElement('strong');
      v.textContent = r.v;
      const l = document.createElement('span');
      l.className = 'tip-l';
      l.textContent = r.l;
      row.append(k, v, l);
      el.appendChild(row);
    });
  },
  show(target, x, y) {
    let spec;
    try { spec = JSON.parse(target.getAttribute('data-tip')); } catch (e) { return; }
    this.build(spec);
    this.el.hidden = false;
    this.place(x, y, target);
  },
  place(x, y, target) {
    const el = this.el;
    const r = el.getBoundingClientRect();
    let left, top;
    if (x == null) {
      const tr = target.getBoundingClientRect();
      left = tr.left + tr.width / 2 - r.width / 2;
      top = tr.top - r.height - 8;
    } else {
      left = x + 14;
      top = y - r.height - 12;
    }
    left = clamp(left, 8, Math.max(8, window.innerWidth - r.width - 8));
    if (top < 8) top = (y == null ? target.getBoundingClientRect().bottom : y) + 16;
    el.style.transform = `translate(${Math.round(left)}px, ${Math.round(top)}px)`;
  },
  hide() { if (this.el) this.el.hidden = true; },
};
let lastPointer = 'mouse';
document.addEventListener('pointerdown', e => { lastPointer = e.pointerType || 'mouse'; }, true);
document.addEventListener('pointerover', e => {
  if (e.pointerType === 'touch' || !Tip.el) return;
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (t) Tip.show(t, e.clientX, e.clientY);
});
document.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch' || !Tip.el || Tip.el.hidden) return;
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) Tip.hide(); else Tip.place(e.clientX, e.clientY, t);
});
document.addEventListener('pointerout', e => {
  if (e.pointerType === 'touch' || !Tip.el) return;
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (t && !(e.relatedTarget && t.contains(e.relatedTarget))) Tip.hide();
});
document.addEventListener('focusin', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (t && Tip.el) Tip.show(t, null, null);
});
document.addEventListener('focusout', () => Tip.hide());
document.addEventListener('click', e => {
  if (!Tip.el) return;
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (lastPointer === 'touch') { if (t) Tip.show(t, null, null); else Tip.hide(); }
}, true);
window.addEventListener('scroll', () => Tip.hide(), { passive: true });

/* ---------- Fotos: Vorschaubilder nachladen, Lightbox ---------- */
const THUMB_CACHE = new Map();
const safeImgSrc = s => (typeof s === 'string' && /^data:image\/(jpeg|png|webp|gif);base64,/.test(s)) ? s : '';
async function hydratePhotos(root) {
  const imgs = $$('img[data-pid]', root || document);
  for (const img of imgs) {
    const id = img.dataset.pid;
    try {
      let src = THUMB_CACHE.get(id);
      if (!src) {
        const t = await getThumb(id);
        src = t ? safeImgSrc(t.data) : '';
        if (!src) { const p = await getPhoto(id); src = p ? safeImgSrc(p.data) : ''; }
        if (src) THUMB_CACHE.set(id, src);
      }
      if (src && img.isConnected) { img.src = src; img.classList.add('loaded'); }
    } catch (e) { /* Foto nicht lesbar */ }
  }
}

function openLightbox(items, index = 0) {
  if (!items || !items.length) return;
  let i = clamp(index, 0, items.length - 1);
  const h = openOverlay(html`
    <div class="lb-inner">
      <button type="button" class="btn icon lb-x" data-dlg="cancel" aria-label="Schließen">${ic('x')}</button>
      <div class="lb-stage"><img class="lb-img" alt="" hidden><div class="lb-load" role="status">Bild wird geladen …</div></div>
      <div class="lb-cap"></div>
      ${items.length > 1 ? html`<button type="button" class="btn icon lb-nav lb-prev" data-lb="-1" aria-label="Vorheriges Bild">${ic('chevL')}</button><button type="button" class="btn icon lb-nav lb-next" data-lb="1" aria-label="Nächstes Bild">${ic('chevR')}</button>` : ''}
    </div>`, {
    cls: 'lb', label: 'Foto ansehen',
    onMount(hh) {
      const img = $('.lb-img', hh.dlg), cap = $('.lb-cap', hh.dlg), load = $('.lb-load', hh.dlg);
      const show = async () => {
        const it = items[i];
        load.hidden = false; load.textContent = 'Bild wird geladen …'; img.hidden = true;
        cap.textContent = (it.caption ? it.caption + ' ' : '') + (items.length > 1 ? `(${i + 1} von ${items.length})` : '');
        try {
          const p = await getPhoto(it.id);
          if (hh.closed) return;
          const src = p ? safeImgSrc(p.data) : '';
          if (src) { img.src = src; img.alt = it.caption || 'Einsatzfoto'; img.hidden = false; load.hidden = true; }
          else load.textContent = 'Das Bild wurde nicht gefunden.';
        } catch (e) { load.textContent = 'Das Bild konnte nicht geladen werden.'; }
      };
      hh.dlg.addEventListener('click', e => {
        const b = e.target.closest('[data-lb]');
        if (!b) return;
        i = (i + Number(b.dataset.lb) + items.length) % items.length;
        show();
      });
      hh.dlg.addEventListener('keydown', e => {
        if (items.length < 2) return;
        if (e.key === 'ArrowLeft') { i = (i - 1 + items.length) % items.length; show(); }
        if (e.key === 'ArrowRight') { i = (i + 1) % items.length; show(); }
      });
      show();
    },
  });
  return h;
}

function autosizeAll(root) { $$('textarea[data-autosize]', root || document).forEach(autosize); }

   Einsatzchronik – Gerüst: Navigation, Seitenwechsel, Sperrbildschirm, Start

const VIEWS = {};   // name -> { render(params) -> Raw, mount(root, params) }

const NAV = [
  { k: 'dashboard', label: 'Dashboard', icon: 'home' },
  { k: 'chronik', label: 'Chronik', icon: 'list' },

  { k: 'kalender', label: 'Dienste', icon: 'calendar' },
  { k: 'stats', label: 'Statistik', icon: 'bars' },

];
const TITLES = { dashboard: 'Dashboard', chronik: 'Einsatzchronik', detail: 'Einsatz', neu: 'Neuer Einsatz', kalender: 'Dienste', stats: 'Statistiken', admin: 'Verwaltung und Einstellungen' };
const navKey = () => (S.route.name === 'detail' ? 'chronik' : S.route.name);
const gearBtn = () => html`<button type="button" class="btn icon ghost gear-b" data-act="nav" data-to="admin" aria-label="Verwaltung und Einstellungen">${ic('gear')}</button>`;

function renderNav() {
  const cur = navKey();
  const item = n => html`<button type="button" class="tab ${n.cta ? 'cta' : ''}" data-act="nav" data-to="${n.k}" ${cur === n.k ? raw('aria-current="page"') : ''} ${n.long ? raw(`aria-label="${esc(n.long)}"`) : ''}>${n.cta ? html`<span class="tab-fab">${ic(n.icon)}</span>` : ic(n.icon)}<span>${n.label}</span></button>`;

    <p class="rail-foot">${S.persistent ? 'Alle Daten liegen nur in diesem Browser auf diesem Gerät.' : (S.storage.mirror === 'ok' ? 'Eingeschränkter Speicher. Siehe Hinweis im Dashboard.' : 'Speicher nicht verfügbar. Daten gehen beim Schließen verloren.')}</p>`.s;
}

/* ---------- Seitenwechsel ---------- */
async function guardLeave(toName, toParams) {
  if (S.route.name !== 'neu') return true;
  if (typeof wizCanLeave === 'function') return wizCanLeave(toName, toParams);
  return true;
}

async function go(name, params = {}, opts = {}) {
  if (S.locked) return;
  if (!(await guardLeave(name, params))) return;
  if (S.route.name === 'neu' && typeof wizLeave === 'function') wizLeave();
  if (opts.reset) S.stack = [];
  else if (!opts.replace) { S.stack.push({ route: S.route, y: window.scrollY }); if (S.stack.length > 30) S.stack.shift(); }
  S.route = { name, params };
  render({ top: true });
}

async function back(fallback = 'chronik') {
  if (!(await guardLeave(fallback, {}))) return;
  if (S.route.name === 'neu' && typeof wizLeave === 'function') wizLeave();
  const prev = S.stack.pop();
  if (prev && prev.route.name !== 'neu') { S.route = prev.route; render({ y: prev.y, top: true }); }
  else go(fallback, {}, { reset: true });
}

function render(opts = {}) {
  if (!S.ready) return;
  if (S.locked) { showLock(); return; }
  const route = S.route;
  const v = VIEWS[route.name] || VIEWS.dashboard;
  const el = $('#view');
  const y = opts.y != null ? opts.y : (opts.keep ? window.scrollY : 0);
  Tip.hide();
  el.innerHTML = v.render(route.params || {}).s;
  document.body.classList.toggle('wiz-on', route.name === 'neu');
  renderNav();
  if (v.mount) v.mount(el, route.params || {});
  autosizeAll(el);
  hydratePhotos(el);
  window.scrollTo(0, y);
  document.title = `${TITLES[route.name] || 'Einsatzchronik'} · Einsatzchronik`;

/* ---------- Ereignisse: data-act, data-bind ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled || el.closest('[hidden]')) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  try {
    const r = fn(el, e);
    if (r && typeof r.catch === 'function') r.catch(onActError);
  } catch (err) { onActError(err); }
});
function onActError(err) {
  console.error(err);
  toast('Das hat nicht geklappt: ' + ((err && err.message) || 'unbekannter Fehler'), { ms: 5200 });
}
function handleBind(e) {
  const el = e.target.closest && e.target.closest('[data-bind]');
  if (!el) return;
  const spec = el.dataset.bind;
  const i = spec.indexOf(':');
  const scope = spec.slice(0, i), path = spec.slice(i + 1);
  const h = BIND[scope];
  if (!h) return;
  const t = el.type;
  const isChange = e.type === 'change';
  const discrete = el.tagName === 'SELECT' || t === 'checkbox' || t === 'radio' || t === 'file';
  if (discrete && !isChange) return;
  // Textfelder melden Änderungen schon beim Tippen. Das spätere change-Ereignis (beim Verlassen des Feldes) würde
  // dieselbe Ansicht noch einmal zeichnen und dabei den Klick auf das neue Ziel verschlucken.
  if (!discrete) { if (isChange && el._bv === el.value) return; el._bv = el.value; }
  const val = t === 'checkbox' ? el.checked : el.value;
  try {
    const r = h(path, val, el, e);
    if (r && typeof r.catch === 'function') r.catch(onActError);
  } catch (err) { onActError(err); }
}

          preview();
        });
        h.dlg.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); save(h); } });
        preview(); syncRep();
        const save = doSave = async hh => {
          const err = q('[data-err]');
          const fail = msg => { err.textContent = msg; err.hidden = false; };
          const date = val('date'), start = val('start'), end = val('end');
          if (!validDate(date)) return fail('Bitte ein gültiges Datum wählen.');
          if (!validTime(start) || !validTime(end)) return fail('Bitte Beginn und Ende eintragen.');
          const kmRaw = val('km').trim();
          const km = kmRaw === '' ? 0 : parseNum(kmRaw);
          if (Number.isNaN(km) || km < 0 || km > 2000) return fail('Die Strecke ist keine gültige Kilometerzahl (0 bis 2000).');
          const place = placeById(val('placeId'));
          const base = { area: st.area, mode: st.mode, placeId: place ? place.id : '', placeName: place ? place.name : (shift && !shift.placeId ? shift.placeName : ''), km, trip: val('trip'), note: val('note').trim() };
          let out = [];
          if (isNew) {
            const rep = REPEATS.find(r => r[0] === val('rep')) || REPEATS[0];
            let n = 1;
            if (rep[2]) { n = parseInt(val('cnt'), 10); if (!(n >= 2 && n <= 60)) return fail('Die Anzahl der Dienste liegt zwischen 2 und 60.'); }
            const sid = n > 1 ? uid() : '';
            for (let i = 0; i < n; i++) out.push(normalizeShift(Object.assign({ id: uid(), date: addDays(date, i * rep[2]), start, end, seriesId: sid }, base)));
            S.shifts.push(...out);
          } else {
            const n = normalizeShift(Object.assign({}, shift, { date, start, end, endDate: '', updatedAt: Date.now() }, base));
            const idx = S.shifts.findIndex(x => x.id === shift.id);
            if (idx >= 0) S.shifts[idx] = n;
            out = [n];
          }
          S.settings.lastShift = { start, end, area: st.area, mode: st.mode, placeId: base.placeId, trip: base.trip };
          await saveShifts(); await saveSettings();
          announceBadges();
          hh.close(out);
        };
      },
    });
  });
}

/* Löschen: Einsätze verlieren die Zuordnung, bei einer Serie kann man die folgenden Termine mitlöschen */
async function deleteShiftFlow(shift) {
  let ids = [shift.id];
  const later = shift.seriesId ? S.shifts.filter(x => x.seriesId === shift.seriesId && x.id !== shift.id && shiftStartTs(x) > shiftStartTs(shift)) : [];
  if (later.length) {
    const c = await choiceBox({
      title: 'Dienst löschen', text: `Dieser Dienst gehört zu einer Serie. Es folgen noch ${plural(later.length, 'weiterer Dienst', 'weitere Dienste')}.`,
      choices: [{ v: 'one', label: 'Nur diesen Dienst löschen', kind: 'danger' }, { v: 'all', label: 'Diesen und alle folgenden löschen', kind: 'danger' }, { v: 'cancel', label: 'Abbrechen', kind: 'ghost' }],
    });
    if (!c) return false;
    if (c === 'all') ids = ids.concat(later.map(x => x.id));
  } else {
    const n = incidentsOfShift(shift.id).length;
    const ok = await confirmBox({ title: 'Dienst löschen?', text: `Der Dienst am ${fmtDateShort(shift.date)} (${shiftTimes(shift)}) wird gelöscht.${n ? ` ${plural(n, 'Einsatz', 'Einsätze')} bleiben erhalten und sind danach keinem Dienst mehr zugeordnet.` : ''}`, ok: 'Löschen', danger: true });
    if (!ok) return false;
  }
  await removeShifts(ids);
  toast(ids.length > 1 ? `${ids.length} Dienste gelöscht` : 'Dienst gelöscht');
  return true;
}
async function removeShifts(ids) {
  const set = new Set(ids);
  S.shifts = S.shifts.filter(x => !set.has(x.id));
  await saveShifts();
  await patchIncidents(i => { if (set.has(i.shiftId)) { i.shiftId = ''; return true; } return false; });
}

/* ---------- Kalender ---------- */
const WD_HEAD = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const monthOf = d => d.slice(0, 7);
const addMonths = (mk, n) => { const [y, m] = mk.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; };

function calGridDays(mk) {
  const [y, m] = mk.split('-').map(Number);
  const first = `${y}-${pad2(m)}-01`;
  const off = (parseDate(first).getDay() + 6) % 7;
  const start = addDays(first, -off);
  const days = Array.from({ length: 42 }, (_, i) => addDays(start, i));
  if (monthOf(days[35]) !== mk) days.length = 35;
  return days;
}

function calMonthStats(mk) {
  const shifts = S.shifts.filter(s => monthOf(s.date) === mk);

function wizInit(params) {

const unitOptions = cur => { const u = S.lists.units.slice(); if (cur && !u.includes(cur)) u.push(cur); return u; };
const routeOptions = cur => { const u = S.lists.routes.slice(); if (cur && !u.includes(cur)) u.push(cur); return u; };

function totalText(m) {
  const sums = new Map();
  m.doses.forEach(x => { if (typeof x.dose === 'number' && !Number.isNaN(x.dose)) sums.set(x.unit, (sums.get(x.unit) || 0) + x.dose); });
  return Array.from(sums.entries()).map(([u, s]) => `${fmtNum(s)} ${u}`).join(' + ');
}
function updateTotals() {
  $$('[data-total]').forEach(el => {
    const m = W.d.medications[Number(el.dataset.total)];
    if (!m) return;
    const t = totalText(m);
    el.hidden = !(m.doses.length > 1 && t);
    const b = el.querySelector('b'); if (b) b.textContent = t;
  });
}

function medHtml(m, mi) {

function stepRD() { return html`<div class="wiz-body">${rdBlocks()}</div>`; }
function rdBlocks() {
  const d = W.d, L = S.lists;
  const hasMedProc = d.procedures.some(p => p.special === 'meds');
  const custom = d.procedures.filter(p => !L.procedures.some(x => x.id === p.refId));
  const tab = S.ui.procTab === 'max' ? 'max' : 'std';
  const nMax = d.procedures.filter(p => p.category === CAT_MAX).length, nStd = d.procedures.length - nMax;

  return html`<div class="group"><h3>Maßnahmen</h3><p class="hint">Mehrfachauswahl. Eigene Maßnahmen stehen danach bei allen künftigen Einsätzen zur Verfügung.</p>

    </div>

        <div class="field"><label class="sr-only" for="w-p${i}-note">Notiz zu ${p.name}</label><input type="text" id="w-p${i}-note" value="${p.note}" data-bind="w:procedures.${i}.note" placeholder="Notiz (optional)" maxlength="300" autocomplete="off"></div>
      </div>`)}</div></div>` : ''}
    ${(hasMedProc || d.medications.length) ? html`<div class="group"><h3>Medikamentengaben</h3>

/* Zusatzangaben zu einzelnen Maßnahmen (Kanülengröße, Atemweg, Reanimation, Defibrillation, Schrittmacher) */
const optChip = (i, path, o, cur) => html`<button type="button" class="chip sm" aria-pressed="${String(String(cur) === String(o.v))}" data-act="wPOpt" data-i="${i}" data-path="${path}" data-v="${o.v}" ${o.keep ? raw('data-keep="1"') : ''}>${o.hex ? html`<i class="cdot" style="--c:${o.hex}" aria-hidden="true"></i>` : ic('check', 'ck')}<span>${o.label}</span>${o.sub ? html`<small>${o.sub}</small>` : ''}</button>`;
const optGroup = (title, chips, hint = '') => html`<div class="xgroup"><p class="xlabel">${title}</p><div class="chips">${chips}</div>${hint ? html`<p class="hint">${hint}</p>` : ''}</div>`;
const numField = (id, label, val, path, unit, ph) => html`<div class="field"><label for="${id}">${label}</label><div class="inwrap"><input type="text" inputmode="numeric" id="${id}" value="${val === '' || val == null ? '' : val}" data-bind="w:${path}" maxlength="3" placeholder="${ph}" autocomplete="off"><span class="unit">${unit}</span></div></div>`;

function procExtras(p, i) {
  const sp = p.special;
  if (sp === 'iv') {
    const sizes = p.sizes && p.sizes.length ? p.sizes : [''];
    return html`<div class="xbox">
      ${sizes.map((sz, j) => html`<div class="xgroup"><div class="xhead"><p class="xlabel">${sizes.length > 1 ? `Zugang ${j + 1}: Kanülengröße` : 'Kanülengröße'}</p>
        ${sizes.length > 1 ? html`<button type="button" class="btn icon sm ghost" data-act="wIvRm" data-i="${i}" data-j="${j}" aria-label="Zugang ${j + 1} entfernen">${ic('x')}</button>` : ''}</div>
        <div class="chips">${IV_SIZES.map(z => optChip(i, `sizes.${j}`, { v: z.k, label: z.k, sub: z.color, hex: z.hex }, sz))}</div></div>`)}
      ${sizes.length < 8 ? html`<div><button type="button" class="btn sm" data-act="wIvAdd" data-i="${i}">${ic('plus')}Weiterer Zugang</button></div>` : ''}
    </div>`;
  }
  if (sp === 'io') {
    return optGroup('Anzahl der i.o.-Zugänge', Array.from({ length: IO_MAX }, (_, n) => optChip(i, 'count', { v: n + 1, label: String(n + 1), keep: true }, p.count || 1)));
  }
  if (sp === 'vent') {
    return optGroup('Art der Beatmung', VENT_TYPES.map(v => optChip(i, 'vent', { v: v.k, label: v.label, sub: v.sub }, p.vent)), 'NIV: nichtinvasive Beatmung, zum Beispiel CPAP oder BiPAP.');
  }
  if (sp === 'airway') {
    const a = p.airway || blankAirway(), m = airwayMethodOf(a.method);
    const grp = g => AIRWAY_METHODS.filter(x => x.group === g).map(x => optChip(i, 'airway.method', { v: x.k, label: x.label }, a.method));
    const cl = CL_GRADES.find(x => x.k === a.cl), mp = MALLAMPATI.find(x => x.k === a.mallampati);
    return html`<div class="xbox">
      <p class="xlabel">Atemweg gesichert mit</p>
      <div class="xgroup"><p class="xsub">${AIRWAY_GROUPS.sg}</p><div class="chips">${grp('sg')}</div></div>
      <div class="xgroup"><p class="xsub">${AIRWAY_GROUPS.et}</p><div class="chips">${grp('et')}</div></div>
      <div class="xgroup"><p class="xsub">${AIRWAY_GROUPS.surg}</p><div class="chips">${grp('surg')}</div></div>
      ${m && m.k === 'eti' ? html`
        ${optGroup('Laryngoskop', LARYNGOSCOPES.map(l => optChip(i, 'airway.laryngoscope', { v: l.k, label: l.label }, a.laryngoscope)))}
        ${optGroup('Sicht auf den Kehlkopf (Cormack-Lehane)', CL_GRADES.map(c => optChip(i, 'airway.cl', { v: c.k, label: c.k }, a.cl)), cl ? `Grad ${cl.k}: ${cl.hint}` : 'Beste Sicht, die du hattest.')}` : ''}
      ${m && m.k !== 'surg' ? optGroup('Mallampati', MALLAMPATI.map(c => optChip(i, 'airway.mallampati', { v: c.k, label: c.k }, a.mallampati)), mp ? `Grad ${mp.k}: ${mp.hint}` : 'Einschätzung vor dem Atemwegsmanagement.') : ''}
    </div>`;
  }
  if (sp === 'cpr') {
    const c = p.cpr || blankCpr();
    return html`<div class="xbox">
      ${optGroup('Initialer Rhythmus bei Beginn der Reanimation', CPR_RHYTHMS.map(r => optChip(i, 'cpr.rhythm', { v: r.k, label: r.label }, c.rhythm)))}
      <div class="xgroup"><p class="xlabel">Defibrillation (optional)</p>
        <div class="sel-grid two">${numField(`w-p${i}-energy`, 'Eingestellte Energie', c.energy, `procedures.${i}.cpr.energy`, 'J', 'z. B. 200')}${numField(`w-p${i}-count`, 'Anzahl Schocks', c.count, `procedures.${i}.cpr.count`, '×', 'z. B. 3')}</div></div>
      ${optGroup('Ergebnis', CPR_ROSC.map(r => optChip(i, 'cpr.rosc', { v: r.k, label: r.label }, c.rosc)), 'ROSC: Wiedereinsetzen eines Spontankreislaufs.')}
    </div>`;
  }
  if (sp === 'shock') {
    const c = p.shock || blankShock();
    return html`<div class="xbox">
      <div class="sel-grid two">${numField(`w-p${i}-energy`, 'Eingestellte Energie', c.energy, `procedures.${i}.shock.energy`, 'J', 'z. B. 120')}${numField(`w-p${i}-count`, 'Anzahl Versuche (optional)', c.count, `procedures.${i}.shock.count`, '×', 'z. B. 2')}</div>
    </div>`;
  }
  if (sp === 'pacer') {
    const c = p.pacer || blankPacer();
    return html`<div class="xbox"><div class="sel-grid two">${numField(`w-p${i}-rate`, 'Eingestellte Frequenz', c.rate, `procedures.${i}.pacer.rate`, '/min', 'z. B. 70')}${numField(`w-p${i}-current`, 'Eingestellte Stromstärke', c.current, `procedures.${i}.pacer.current`, 'mA', 'z. B. 60')}</div></div>`;
  }
  return '';
}
ACT.wPOpt = el => {
  const p = W.d.procedures[Number(el.dataset.i)];
  if (!p) return;
  const path = el.dataset.path, v = el.dataset.v;
  const cur = getByPath(p, path);

function newDose(ref, prev) {
  if (prev) return { id: uid(), doseText: prev.doseText, dose: prev.dose, unit: prev.unit, route: prev.route, time: defaultTime(), effect: 'unrated', note: '' };
  return { id: uid(), doseText: '', dose: null, unit: (ref && ref.unit) || 'mg', route: (ref && ref.route) || '', time: defaultTime(), effect: 'unrated', note: '' };
}
function medUsage() {
  const m = new Map();
  S.incidents.forEach(i => i.medications.forEach(x => { if (x.refId) m.set(x.refId, (m.get(x.refId) || 0) + x.doses.length); }));
  return m;
}
function pickMedication() {
  return new Promise(resolve => {
    const usage = medUsage();
    const list = q => {
      const nq = norm(q.trim());
      let items = S.lists.medications.filter(m => !nq || norm(m.name + ' ' + m.aka).includes(nq));
      items.sort((a, b) => {
        if (nq) { const as = norm(a.name).startsWith(nq) ? 0 : 1, bs = norm(b.name).startsWith(nq) ? 0 : 1; if (as !== bs) return as - bs; }
        return (usage.get(b.id) || 0) - (usage.get(a.id) || 0) || byName(a.name, b.name);
      });
      items = items.slice(0, 250);
      const exact = S.lists.medications.some(m => norm(m.name) === nq);
      return html`${items.map(m => html`<button type="button" class="pick" data-dlg="pick" data-id="${m.id}"><span>${m.name}${m.aka ? html` <small>${m.aka}</small>` : ''}</span><small>${m.unit}</small></button>`)}
        ${nq && !exact ? html`<button type="button" class="pick" data-dlg="new" data-q="${q.trim()}"><span>„${q.trim()}“ neu anlegen</span>${ic('plus')}</button>` : ''}
        ${!items.length && !nq ? html`<p class="muted small">Keine Medikamente vorhanden.</p>` : ''}`;
    };
    openOverlay(dlgHtml({
      title: 'Medikament wählen',
      body: html`<div class="field"><label class="sr-only" for="medq">Suchen</label><input type="search" id="medq" placeholder="Name oder Handelsname suchen" autocomplete="off"></div><div class="pick-list" id="medlist">${list('')}</div>`,
      actions: html`<button type="button" class="btn" data-dlg="cancel">Abbrechen</button>`,
    }), {
      label: 'Medikament wählen', focus: '#medq',
      onAction(act, h, b) {
        if (act === 'pick') h.close({ id: b.dataset.id });
        else if (act === 'new') h.close({ newName: b.dataset.q });
        else h.close(null);
      },
      onMount(h) { $('#medq', h.dlg).addEventListener('input', e => { $('#medlist', h.dlg).innerHTML = list(e.target.value).s; }); },
      onClose: r => resolve(r && typeof r === 'object' ? r : null),
    });
  });
}
ACT.wAddMed = async () => {
  const r = await pickMedication();
  if (!r) return;
  const d = W.d;
  let ref;
  if (r.newName) {
    const f = await formBox({
      title: 'Neues Medikament',
      fields: [
        { key: 'name', label: 'Name', value: r.newName, required: true },
        { key: 'aka', label: 'Handelsname oder Suchbegriffe (optional)', placeholder: 'z. B. Handelsname' },
        { key: 'unit', type: 'select', label: 'Standardeinheit', value: 'mg', options: S.lists.units.map(u => ({ value: u, label: u })) },
      ], submit: 'Anlegen',
    });
    if (!f) return;
    ref = S.lists.medications.find(m => norm(m.name) === norm(f.name));
    if (!ref) { ref = { id: uid(), name: f.name, aka: f.aka, unit: f.unit, route: '' }; S.lists.medications.push(ref); await saveLists(); }
  } else ref = S.lists.medications.find(m => m.id === r.id);
  if (!ref) return;
  let mi = d.medications.findIndex(m => m.refId === ref.id);
  if (mi >= 0) {
    const m = d.medications[mi];
    m.doses.push(newDose(ref, m.doses[m.doses.length - 1]));
    toast(`Weitere Gabe für ${ref.name} hinzugefügt`);
    W.focusSel = `#w-m${mi}-d${m.doses.length - 1}-dose`;
  } else {
    d.medications.push({ id: uid(), refId: ref.id, name: ref.name, doses: [newDose(ref)] });
    mi = d.medications.length - 1;
    W.focusSel = `#w-m${mi}-d0-dose`;
  }
  const mp = S.lists.procedures.find(p => p.special === 'meds');
  if (mp && !d.procedures.some(p => p.refId === mp.id)) d.procedures.push({ id: uid(), refId: mp.id, name: mp.name, category: mp.category, role: 'self', note: '', special: 'meds' });
  markDirty(); rerender();
};
ACT.wAddDose = el => {

async function wizNewListValue(path, listKey, title, label) {
  const n = await promptText({ title, label, placeholder: listKey === 'units' ? 'z. B. mmol' : 'z. B. endotracheal' });
