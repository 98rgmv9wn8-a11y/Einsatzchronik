function usageCount(kind, item) {
  const names = { tags: i => i.tags.includes(item.name), rdTypes: i => i.types.includes(item.name), fwOtherTypes: i => i.otherTypes.includes(item.name), dlrgTypes: i => i.scenarios.includes(item.name) };
  switch (kind) {
    case 'activities': return S.incidents.filter(i => i.activities.some(a => a.refId === item.id)).length;
    case 'procedures': return S.incidents.filter(i => i.procedures.some(a => a.refId === item.id)).length;
    case 'medications': return S.incidents.filter(i => i.medications.some(a => a.refId === item.id)).length;
    case 'vehicles': return S.incidents.filter(i => i.vehicleId === item.id).length;
    case 'functions': return S.incidents.filter(i => i.domain === item.domain && i.role === item.name).length;
    case 'places': return S.shifts.filter(s => s.placeId === item.id).length;
    case 'units': return S.incidents.filter(i => i.medications.some(m => m.doses.some(d => d.unit === item))).length;
    case 'routes': return S.incidents.filter(i => i.medications.some(m => m.doses.some(d => d.route === item))).length;
    default: return names[kind] ? S.incidents.filter(names[kind]).length : 0;
  }
}

function listPanel() {

    if (D.groups) {

      items.forEach(e => { const g = D.groups(e.x); if (!gs.has(g)) gs.set(g, { ord: D.order ? D.order(e.x) : 0, list: [] }); gs.get(g).list.push(e); });

}

ACT.storageTest = async () => {
  const res = [], stamp = `t${Date.now()}`;
  try {
    await DB.put('kv', stamp, 'selftest');
    const back = await DB.get('kv', 'selftest');
    await DB.del('kv', 'selftest');
    res.push(['Datenbank', back === stamp ? 'Schreiben und Lesen funktioniert' : 'Der gelesene Wert weicht ab']);
    if (DB.mode === 'idb') { const n = (await DB.keys('incidents')).length; res.push(['Einsätze gespeichert', `${n} von ${S.incidents.length}${n === S.incidents.length ? '' : ' (Abweichung, bitte Backup anlegen)'}`]); }
    else res.push(['Hinweis', 'Die Datenbank ist nicht erreichbar, es wird nur der Arbeitsspeicher benutzt']);
  } catch (e) { res.push(['Datenbank', `Fehler: ${(e && e.message) || 'unbekannt'}`]); }
  try { localStorage.setItem('ec-selftest', stamp); const ok = localStorage.getItem('ec-selftest') === stamp; localStorage.removeItem('ec-selftest'); res.push(['Notfallkopie', ok ? 'funktioniert' : 'weicht ab']); }
  catch (e) { res.push(['Notfallkopie', 'nicht möglich']); }
  const info = await storageInfo();
  res.push(['Dauerhaft gesichert', info.persisted == null ? 'unbekannt' : (info.persisted ? 'ja' : 'nein')]);
  res.push(['Letztes Backup', S.settings.lastBackup ? fmtStamp(S.settings.lastBackup) : 'noch keines']);
  const bad = res.some(([, v]) => /Fehler|weicht|nicht möglich|nicht erreichbar/.test(v));
  await alertBox({ title: bad ? 'Speichertest: Auffälligkeiten' : 'Speichertest bestanden', text: res.map(([k, v]) => `${k}: ${v}`).join('\n') });
  fillStorage();
};

  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  set('st-photos', String(keys.length));
  set('st-usage', info.usage != null ? `${fmtBytes(info.usage)}${info.quota ? ' von ' + fmtBytes(info.quota) : ''}` : 'nicht ermittelbar');
  set('st-persist', info.persisted == null ? 'unbekannt' : (info.persisted ? 'ja' : 'nein'));
  const m = document.getElementById('st-meter');
  if (m && info.usage != null && info.quota) m.style.setProperty('--w', String(Math.min(1, info.usage / info.quota)));
  const b = document.getElementById('st-persist-btn');
  if (b) b.hidden = !(info.persisted === false);
}
ACT.wipeAll = async () => {
  const r = await formBox({
    title: 'Alle Daten löschen?',
    intro: 'Alle Einsätze, Dienste, Fotos, Entwürfe, Listen und Einstellungen werden von diesem Gerät entfernt. Zur Bestätigung gib LÖSCHEN ein.',
    fields: [{ key: 'w', label: 'Bestätigung', placeholder: 'LÖSCHEN', required: true, validate: v => (v.trim().toUpperCase() === 'LÖSCHEN' ? '' : 'Bitte gib das Wort LÖSCHEN ein.') }],
    submit: 'Endgültig löschen', danger: true,
  });
  if (!r) return;
  await wipeAll();
  THUMB_CACHE.clear();
  applyTheme();
  toast('Alle Daten wurden gelöscht');
  await go('dashboard', {}, { reset: true });
};

/* ---------- Tab: Sicherheit ---------- */
const AUTO_OPTS = [['0', 'Sofort beim Verlassen der App'], ['1', 'Nach 1 Minute'], ['5', 'Nach 5 Minuten'], ['off', 'Nur manuell sperren']];
function securityPanel() {
  const L = S.settings.lock;
  return html`<div class="stack" style="gap:16px">
    <section class="setrow"><h3>App-Sperre</h3>
      ${L ? html`<p>Die Sperre ist aktiv. Beim Öffnen der App wird die PIN abgefragt.</p>
        <div class="field"><label for="a-auto">Automatisch sperren</label><select id="a-auto" data-bind="adm:autoLock">${AUTO_OPTS.map(([v, l]) => html`<option value="${v}" ${L.auto === v ? 'selected' : ''}>${l}</option>`)}</select></div>
        <div class="flex"><button type="button" class="btn primary" data-act="lockNow">${ic('lock')}Jetzt sperren</button><button type="button" class="btn" data-act="changePin">PIN ändern</button><button type="button" class="btn danger" data-act="removePin">Sperre entfernen</button></div>`
      : html`<p>Schütze die App mit einer PIN. Wer das Gerät in die Hand nimmt, sieht dann keine Einsätze.</p>
        <div><button type="button" class="btn primary" data-act="setPin">${ic('lock')}PIN festlegen</button></div>`}
      <p class="hint">Die Sperre verdeckt die App. Sie verschlüsselt die gespeicherten Daten im Browser nicht. Wer technischen Zugriff auf das Gerät und den Browser hat, kann sie umgehen. Wenn du Daten weitergibst oder ablegst, nutze ein verschlüsseltes Backup.</p></section>
    <section class="setrow"><h3>Datenschutz</h3>
      <p>Die Einsatzchronik ist ein privates Lernarchiv und kein Ersatz für offizielle Einsatz- oder Patientendokumentation.</p>
      <ul style="margin:0;padding-left:20px;display:grid;gap:6px;color:var(--text-2)">
        <li>Keine identifizierenden Patientendaten eintragen.</li>
        <li>Keine erkennbaren Patienten, Kennzeichen oder internen Unterlagen ohne Berechtigung fotografieren.</li>
        <li>Daten bleiben lokal in diesem Browser. Backups und Export löst du selbst aus.</li>
        <li>Einträge und Fotos lassen sich jederzeit exportieren und löschen.</li></ul></section>
  </div>`;
}
const pinField = (key, label) => ({ key, type: 'password', label, mode: 'numeric', required: true, maxlength: 12 });
const pinCheck = v => (/^\d{4,12}$/.test(v) ? '' : 'Die PIN besteht aus 4 bis 12 Ziffern.');
async function askNewPin(title) {
  if (!CRY.ok()) { toast('Die App-Sperre ist in diesem Browser nicht verfügbar.', { ms: 5000 }); return null; }
  const r = await formBox({
    title, intro: 'Wähle eine PIN aus 4 bis 12 Ziffern.',
    fields: [{ ...pinField('p1', 'Neue PIN'), validate: pinCheck }, pinField('p2', 'PIN wiederholen'),
      { key: 'auto', type: 'select', label: 'Automatisch sperren', value: (S.settings.lock && S.settings.lock.auto) || '1', options: AUTO_OPTS.map(([v, l]) => ({ value: v, label: l })) }],
    submit: 'Speichern',
  });
  if (!r) return null;
  if (r.p1 !== r.p2) { toast('Die beiden PINs stimmen nicht überein.'); return null; }
  return r;
}
async function askCurrentPin(title) {
  const r = await formBox({ title, fields: [pinField('p', 'Aktuelle PIN')], submit: 'Weiter' });
  if (!r) return false;
  const ok = await CRY.verifyPin(r.p).catch(() => false);
  if (!ok) toast('Die PIN ist falsch.');
  return ok;
}
ACT.setPin = async () => { const r = await askNewPin('PIN festlegen'); if (!r) return; await CRY.setupLock(r.p1, r.auto); toast('App-Sperre aktiviert'); rerender(); };
ACT.changePin = async () => { if (!(await askCurrentPin('PIN ändern'))) return; const r = await askNewPin('Neue PIN festlegen'); if (!r) return; await CRY.setupLock(r.p1, r.auto); toast('PIN geändert'); rerender(); };
ACT.removePin = async () => {
  if (!(await askCurrentPin('Sperre entfernen'))) return;
  S.settings.lock = null; await saveSettings(); toast('App-Sperre entfernt'); rerender();
};
ACT.lockNow = () => lockNow();

const ADMIN_TABS = [['lists', 'Listen'], ['data', 'Daten'], ['security', 'Sicherheit'], ['about', 'Darstellung']];
VIEWS.admin = {
  render() {
    const tab = S.ui.adminTab;
    let panel;
    if (tab === 'lists') {
      panel = html`<div class="kinds" role="group" aria-label="Liste wählen">${LKINDS.map(k => html`<button type="button" class="chip sm" aria-pressed="${String(S.ui.listKind === k)}" data-act="lKind" data-k="${k}">${LDEF[k].label}</button>`)}</div>${listPanel()}`;
    } else if (tab === 'data') panel = dataPanel();
    else if (tab === 'security') panel = securityPanel();
    else panel = aboutPanel();
    return html`<div class="pg-h"><div><h1>Verwaltung</h1><p class="sub">Listen, Backups, Sicherheit und Einstellungen</p></div></div>
      <div class="tabs" role="tablist" aria-label="Bereiche der Verwaltung">${ADMIN_TABS.map(([k, l]) => html`<button type="button" role="tab" id="tab-${k}" aria-selected="${String(tab === k)}" data-act="adminTab" data-v="${k}">${l}</button>`)}</div>
      <div role="tabpanel" aria-labelledby="tab-${tab}">${panel}</div>`;
  },
  mount() { if (S.ui.adminTab === 'data') fillStorage(); },
};
ACT.adminTab = el => { S.ui.adminTab = el.dataset.v; rerender(); };

const listSearchSoon = debounce(() => { const b = $('#l-body'); if (b) rerender(); }, 160);
BIND.adm = async (path, val, el) => {
  if (path === 'listSearch') {
    S.ui.listSearch = val;
    // nur die Liste neu zeichnen, damit das Suchfeld den Fokus behält
    const tmp = listPanel().s, d = document.createElement('div'); d.innerHTML = tmp;
    const nb = d.querySelector('#l-body'), ob = $('#l-body');
    if (nb && ob) ob.innerHTML = nb.innerHTML;
    return;
  }
  if (path === 'autoLock') { if (S.settings.lock) { S.settings.lock.auto = val; await saveSettings(); toast('Gespeichert'); } return; }
  if (path === '__import') {
    const f = el.files && el.files[0];
    el.value = '';
    if (!f) return;
    let r;
    try { r = await importBackupFile(f); }
    catch (e) { await alertBox({ title: 'Backup nicht eingespielt', text: (e && e.message) || 'Die Datei konnte nicht gelesen werden.' }); return; }
    if (!r) return;
    const parts = [r.added ? `${plural(r.added, 'Einsatz', 'Einsätze')} neu` : '', r.updated ? `${r.updated} aktualisiert` : '', r.skipped ? `${r.skipped} unverändert` : '', r.shifts ? plural(r.shifts, 'Dienst', 'Dienste') : ''].filter(Boolean);
    toast(`Backup eingespielt${parts.length ? ': ' + parts.join(', ') : ', es gab nichts Neues'}`, { ms: 6000 });
    rerender();
  }
};
